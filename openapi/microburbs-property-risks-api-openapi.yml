        erosion:
          anyOf:
          - items:
              $ref: '#/components/schemas/RiskRecord'
            type: array
          - type: 'null'
          title: Erosion
          example:
          - area_level: Layer
            area_name: Risk Layer
            features_within_radius: 4
            name: Erosion
            nearest_distance_m: 245.0
            on_property: false
            search_radius_m: 1000
            value: Not on property; nearest 245 m away
        environment:
          anyOf:
          - items:
              $ref: '#/components/schemas/RiskRecord'
            type: array
          - type: 'null'
          title: Environment
          example:
          - area_level: Layer
            area_name: Risk Layer
            features_within_radius: 3
            name: Environment
            nearest_distance_m: 640.0
            on_property: false
            search_radius_m: 1000
            value: Not on property; nearest 640 m away
        hv_power_line:
          anyOf:
          - items:
              $ref: '#/components/schemas/RiskRecord'
            type: array
          - type: 'null'
          title: Hv Power Line
          example:
          - area_level: Layer
            area_name: Risk Layer
            features_within_radius: 1
            name: HV Power Line
            nearest_distance_m: 341.0
            on_property: false
            search_radius_m: 1000
            value: Not on property; nearest 341 m away
        mobile_black_spot:
          anyOf:
          - items:
              $ref: '#/components/schemas/RiskRecord'
            type: array
          - type: 'null'
          title: Mobile Black Spot
          example:
          - area_level: Layer
            area_name: Risk Layer
            features_within_radius: 1
            name: Mobile Black Spot
            nearest_distance_m: 812.0
            on_property: false
            search_radius_m: 1000
            value: Not on property; nearest 812 m away
      type: object
      title: AllRisks
      description: 'Every property-level risk overlay in one call.


        One failing helper doesn''t kill the bundle — nulls pass through.

        Customer is still billed the full bundle price; check each field

        for null + use X-Request-Id for any support follow-up.'
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
