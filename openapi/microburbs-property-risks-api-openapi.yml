openapi: 3.2.0
info:
  title: Microburbs Property Data Property - Risks API
  summary: Suburb and property data for every Australian locality.
  description: '**One REST API for demographics, market indicators, risk scores, AVM and

    ranking — backed by 25+ years of Australian transactions and census data.**


    ```bash

    curl ''https://api.microburbs.com.au/v1/properties/GANSW704074813/profile'' \

    -H ''Authorization: Bearer test''

    ```


    ## Why Microburbs


    - **Data depth** — Demographics, lifestyle, risk, market, AVM and growth forecasts — all keyed to the same national suburb and property graph.'
  version: 1.0.0
servers:
- url: https://api.microburbs.com.au
  description: Production
security:
- BearerAuth: []
tags:
- name: Property - Risks
  description: Bushfire, flood, heritage, landslide, erosion, etc.
paths:
  /v1/properties/{gnaf_id}/risks/bushfire:
    get:
      tags:
      - Property - Risks
      summary: Bushfire-prone overlay
      description: 'Bushfire-prone-area overlays within 1 km. Read `on_property` — a returned

        row means "found nearby", not "this property is in a bushfire zone".


        **Price: 15¢ per call.**'
      operationId: get_property_risk_bushfire_v1_properties__gnaf_id__risks_bushfire_get
      parameters:
      - name: gnaf_id
        in: path
        required: true
        schema:
          type: string
          title: Gnaf Id
          example: GANSW704074813
        example: GANSW704074813
      - name: geojson
        in: query
        required: false
        schema:
          type: boolean
          description: When true, add a `geojson` FeatureCollection of the hazard polygons clipped to a 1km-radius circle around the property, plus `geojson_meta` (default false — response unchanged).
          default: false
          title: Geojson
        description: When true, add a `geojson` FeatureCollection of the hazard polygons clipped to a 1km-radius circle around the property, plus `geojson_meta` (default false — response unchanged).
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_list_RiskRecord__'
              example:
                data:
                - area_level: Layer
                  area_name: Risk Layer
                  name: Fire
                  value: On property
                  on_property: true
                  nearest_distance_m: 0.0
                  search_radius_m: 1000
                  features_within_radius: 25
          headers:
            X-Cost-Cents:
              description: Exact cents billed for this call.
              required: true
              schema:
                type: integer
                minimum: 0
            X-Spent-Cents:
              description: Cumulative cents Autumn reports used for this prepaid wallet.
              required: true
              schema:
                type: integer
                minimum: 0
            X-Remaining-Cents:
              description: Spendable prepaid credit left after this call.
              required: true
              schema:
                type: integer
                minimum: 0
            X-Period-End:
              description: Start of the next UTC calendar month. Prepaid credit does not expire at this timestamp.
              required: true
              schema:
                type: string
                format: date-time
            X-Balance-Cents:
              description: Compatibility alias of X-Remaining-Cents.
              required: true
              schema:
                type: integer
                minimum: 0
            X-Rate-Card-Version:
              description: Version of the endpoint rate card used for this call.
              required: true
              schema:
                type: integer
                minimum: 1
            X-Request-Id:
              description: Request identifier to quote in support requests.
              required: true
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail:
                - type: missing
                  loc:
                  - query
                  - address
                  msg: Field required
                  input: null
      x-sample-response:
      - area_level: Layer
        area_name: Risk Layer
        name: Fire
        value: On property
        on_property: true
        nearest_distance_m: 0.0
        search_radius_m: 1000
        features_within_radius: 25
      x-price-cents: 15
