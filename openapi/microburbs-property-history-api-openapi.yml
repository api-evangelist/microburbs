  /v1/properties/{gnaf_id}/history/all:
    get:
      tags:
      - Property - History
      summary: All sale + rent history — bundle
      description: '**Price: 80¢ per call.**'
      operationId: get_property_history_all_v1_properties__gnaf_id__history_all_get
      parameters:
      - name: gnaf_id
        in: path
        required: true
        schema:
          type: string
          title: Gnaf Id
          example: GANSW704074813
        example: GANSW704074813
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_HistoryAll_'
              example:
                data:
                  rent_history:
                  - address: 9 Mcdowall Place
                    date: '2025-07-24'
                    price: 750
                    type: For Rent
                  - address: 9 Mcdowall Place
                    date: '2022-10-10'
                    type: For Rent
                  rent_history_latest:
                    address: 9 Mcdowall Place
                    date: '2025-07-24'
                    price: 750
                    type: For Rent
                  sale_history:
                  - address: 9 Mcdowall Place
                    date: '2025-06-05'
                    price: 990000
                    type: Sold
                  - address: 9 Mcdowall Place
                    date: '2025-05-22'
                    type: For Sale
