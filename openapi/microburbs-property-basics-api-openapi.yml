    ParkingCount:
      properties:
        parking_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Parking Count
          description: Covered car spaces (garage/carport) as advertised. It does not count open driveway or street parking, so a house with a wide driveway and no garage can legitimately read 0 or null. Null means unknown.
      type: object
      required:
      - parking_count
      title: ParkingCount
      example:
        parking_count: 5
    ApiResponse_LandAreaSqm_:
      properties:
        data:
          anyOf:
          - $ref: '#/components/schemas/LandAreaSqm'
          - type: 'null'
          description: The endpoint's payload, or `null` when Microburbs has no value.
        available:
