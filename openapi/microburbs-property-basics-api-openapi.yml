components:
  schemas:
    LandAreaSqm:
      properties:
        land_area_sqm:
          anyOf:
          - type: number
          - type: 'null'
          title: Land Area Sqm
          description: Land size in square metres — the figure the property was advertised with, not a survey or cadastral parcel measurement, so treat it as indicative. Acreage advertised in hectares is converted to square metres for you (1 ha = 10,000 sqm), which means small values are rare by construction and a suspiciously round large number may be a converted one. Null means no listing stated a land size; expect that on most apartments and units.
      type: object
      required:
      - land_area_sqm
      title: LandAreaSqm
      example:
        land_area_sqm: 814.0
    ApiResponse_BedCount_:
      properties:
        data:
          anyOf:
          - $ref: '#/components/schemas/BedCount'
          - type: 'null'
          description: The endpoint's payload, or `null` when Microburbs has no value.
        available:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Available
          description: '`false` on no-data responses. Omitted on success — branch on `data !== null` if you want a single discriminator.'
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Machine-readable slug naming the no-data condition (e.g. `no_avm_for_GANSW704074813`). Stable per endpoint. Omitted on success.
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
          description: Human-readable explanation. Omitted on success.
      type: object
      title: ApiResponse[BedCount]
    BedCount:
      properties:
        bed_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Bed Count
          description: Bedrooms, as advertised when the property was last on the market. Null means no listing on record ever stated one — read it as unknown, never as zero.
      type: object
      required:
      - bed_count
      title: BedCount
      example:
        bed_count: 4
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    BasicsAll:
      properties:
        bed_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Bed Count
          description: Bedrooms as advertised. Null = unknown, not zero.
        bath_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Bath Count
          description: Bathrooms as advertised, whole number. Null = unknown, not zero.
        parking_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Parking Count
          description: Covered car spaces (garage/carport) as advertised — excludes open driveway and street parking. Null = unknown.
        dwelling_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Dwelling Type
          description: Dwelling kind in lowercase free text ('house', 'unit', 'townhouse', …), from the listing or the national address file. Not a closed set.
        land_area_sqm:
          anyOf:
          - type: number
          - type: 'null'
          title: Land Area Sqm
          description: Advertised land size in square metres (hectares converted for you), indicative rather than surveyed. Null = not stated; usual for units.
      type: object
      title: BasicsAll
      description: 'All property basics — beds, baths, parking, dwelling type, land area —

        in one call.


        Every one of these comes from what the property was advertised with, so

        a null is "never advertised" rather than "zero", and a property that has

        never been listed comes back with all five null. Values are returned

        flat here (no per-field wrapper object, unlike the individual endpoints).'
      example:
        bath_count: 2
        bed_count: 4
        dwelling_type: house
        land_area_sqm: 814.0
        parking_count: 5
    DwellingType:
      properties:
        dwelling_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Dwelling Type
          description: 'What kind of dwelling it is — lowercase free text such as ''house'', ''unit'', ''townhouse'', ''apartment''. Taken from the advertised listing type, falling back to the national address file''s classification when no listing states one. Not a closed set: match case-insensitively and allow for values outside the common few.'
      type: object
      required:
      - dwelling_type
      title: DwellingType
      example:
        dwelling_type: house
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ApiResponse_BathCount_:
      properties:
        data:
          anyOf:
          - $ref: '#/components/schemas/BathCount'
          - type: 'null'
          description: The endpoint's payload, or `null` when Microburbs has no value.
