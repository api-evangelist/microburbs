                  msg: Field required
                  input: null
      x-price-cents: 6
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    EthnicityRow:
      properties:
        area_name:
          type: string
          title: Area Name
          description: Suburb (SAL) name.
        area_level:
          type: string
          title: Area Level
          description: Always 'suburb'.
        proportion:
          anyOf:
          - type: number
          - type: 'null'
          title: Proportion
          description: Share of the suburb identifying with this category (0–1).
        ancestry:
          anyOf:
          - type: string
          - type: 'null'
          title: Ancestry
          description: Only on /ethnicity/ancestry.
        birthplace:
          anyOf:
          - type: string
          - type: 'null'
          title: Birthplace
          description: Only on /ethnicity/birthplace.
      additionalProperties: true
      type: object
      required:
      - area_name
      - area_level
      title: EthnicityRow
      description: One row of ancestry / birthplace data.
      example:
        ancestry: Australians
        area_level: suburb
        area_name: Belmont North
        proportion: 0.926304347826087
    EthnicityAll:
      properties:
        ancestry:
          anyOf:
          - items:
              $ref: '#/components/schemas/EthnicityRow'
            type: array
          - type: 'null'
          title: Ancestry
        birthplace:
          anyOf:
          - items:
              $ref: '#/components/schemas/EthnicityRow'
            type: array
          - type: 'null'
          title: Birthplace
      type: object
      title: EthnicityAll
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ApiResponse_list_EthnicityRow__:
      properties:
        data:
          anyOf:
          - items:
              $ref: '#/components/schemas/EthnicityRow'
            type: array
          - type: 'null'
          title: Data
          description: The endpoint's payload, or `null` when Microburbs has no value.
        available:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Available
          description: '`false` on no-data responses. Omitted on success — branch on `data !== null` if you want a single discriminator.'
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Machine-readable slug naming the no-data condition (e.g. `no_avm_for_GANSW704074813`). Stable per endpoint. Omitted on success.
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
          description: Human-readable explanation. Omitted on success.
      type: object
      title: ApiResponse[list[EthnicityRow]]
    ApiResponse_EthnicityAll_:
      properties:
        data:
          anyOf:
          - $ref: '#/components/schemas/EthnicityAll'
          - type: 'null'
          description: The endpoint's payload, or `null` when Microburbs has no value.
        available:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Available
          description: '`false` on no-data responses. Omitted on success — branch on `data !== null` if you want a single discriminator.'
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Machine-readable slug naming the no-data condition (e.g. `no_avm_for_GANSW704074813`). Stable per endpoint. Omitted on success.
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
          description: Human-readable explanation. Omitted on success.
      type: object
      title: ApiResponse[EthnicityAll]
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: API key as Bearer token. Use `test` for the public sandbox (works only for GNAFs GANSW704074813, GAACT714845944, GAVIC419929404, GAQLD162849753, GAWA_146662014, GASA_422266490, GATAS702292990, GANT_703835649 and SALs 'Belmont North', 'Bondi', 'St Kilda (Vic.)', 'Fortitude Valley', 'Subiaco', 'Unley', 'Sandy Bay', 'Kambah', 'Nightcliff', always 0¢). Mint your own at /developers/keys for full access.
