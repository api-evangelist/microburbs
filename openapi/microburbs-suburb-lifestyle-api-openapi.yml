  /v1/suburbs/{suburb_name}/lifestyle/pois:
    get:
      tags:
      - Suburb - Lifestyle
      summary: POIs / amenities in the suburb (pubs, cafes, gyms, schools, …)
      description: 'Every named venue / amenity in the suburb as GeoJSON Point features, plus a

        per-category count.


        Each point carries `name`, a broad `category` (Restaurant / Cafe, Shopping,

        Health, Entertainment, Sport & Fitness, Education, …) and a finer `subtype`

        (e.g. `pub`, `bar`, `cafe`, `restaurant`, `gym`, `supermarket`, `school`,

        `pharmacy`). This is the endpoint for "what / how many are in

        this suburb" and "name the pubs / cafes / gyms in X" — filter or count the

        features on `subtype`, and read real venue names from `name`. The top-level

        `categories` array gives the broad-category counts without walking the list.


        Unpaged by default. Big suburbs are big — Sydney is ~3.7 MB of features — so

        pass `limit`/`offset` (or narrow with `category`) when you don''t need them

        all. `count` and `categories` always describe the whole suburb, so paging

        never hides the totals. Flat price per call regardless of page size.


        **Exact suburb identifier required.** Exact ABS Suburb and Locality (SAL) name, e.g. `Burwood (NSW)` — many suburbs carry a state suffix. If starting from free text or an unverified bare name, first call `GET /v1/geocode/suburb?q=`, then use the exact `data[].area_name` it returns. Suburb data endpoints do not guess a state or typo-correct names.


        **Price: 25¢ per call.**'
      operationId: get_suburb_lifestyle_pois_v1_suburbs__suburb_name__lifestyle_pois_get
      parameters:
      - name: suburb_name
        in: path
        required: true
        schema:
          type: string
          title: Suburb Name
          example: Belmont North
        description: Exact ABS Suburb and Locality (SAL) name, e.g. `Burwood (NSW)` — many suburbs carry a state suffix. If starting from free text or an unverified bare name, first call `GET /v1/geocode/suburb?q=<text>`, then use the exact `data[].area_name` it returns. Suburb data endpoints do not guess a state or typo-correct names.
        example: Belmont North
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          description: 'Features to return (default: all).'
          title: Limit
        description: 'Features to return (default: all).'
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Feature offset — page with `limit`.
          default: 0
          title: Offset
        description: Feature offset — page with `limit`.
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Only this display category (e.g. `Shopping`). Case-insensitive.
          title: Category
        description: Only this display category (e.g. `Shopping`). Case-insensitive.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_LifestylePois_'
              example:
                data:
                  area_level: suburb
                  area_name: Belmont North
                  categories:
                  - category: Shopping
                    count: 32
                  - category: Sport & Fitness
                    count: 26
                  count: 177
                  pois:
                    features:
                    - geometry:
                        coordinates:
                        - 151.66231
                        - -33.02463
                        type: Point
                      properties:
                        name: Ampol Foodary
                        category: Shopping
                        subtype: newsagent
                        dim: convenience
                      type: Feature
                    type: FeatureCollection
          headers:
            X-Cost-Cents:
              description: Exact cents billed for this call.
              required: true
              schema:
                type: integer
                minimum: 0
            X-Spent-Cents:
              description: Cumulative cents Autumn reports used for this prepaid wallet.
              required: true
              schema:
                type: integer
                minimum: 0
            X-Remaining-Cents:
              description: Spendable prepaid credit left after this call.
              required: true
              schema:
                type: integer
                minimum: 0
            X-Period-End:
              description: Start of the next UTC calendar month. Prepaid credit does not expire at this timestamp.
              required: true
              schema:
                type: string
                format: date-time
            X-Balance-Cents:
              description: Compatibility alias of X-Remaining-Cents.
              required: true
              schema:
                type: integer
                minimum: 0
            X-Rate-Card-Version:
              description: Version of the endpoint rate card used for this call.
              required: true
              schema:
                type: integer
                minimum: 1
            X-Request-Id:
              description: Request identifier to quote in support requests.
              required: true
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail:
                - type: missing
                  loc:
                  - query
                  - address
                  msg: Field required
                  input: null
      x-price-cents: 25
