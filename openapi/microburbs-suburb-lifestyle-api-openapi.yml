openapi: 3.2.0
info:
  title: Microburbs Property Data Suburb - Lifestyle API
  summary: Suburb and property data for every Australian locality.
  description: '**One REST API for demographics, market indicators, risk scores, AVM and

    ranking — backed by 25+ years of Australian transactions and census data.**


    ```bash

    curl ''https://api.microburbs.com.au/v1/properties/GANSW704074813/profile'' \

    -H ''Authorization: Bearer test''

    ```


    ## Why Microburbs


    - **Data depth** — Demographics, lifestyle, risk, market, AVM and growth forecasts — all keyed to the same national suburb and property graph.'
  version: 1.0.0
servers:
- url: https://api.microburbs.com.au
  description: Production
security:
- BearerAuth: []
tags:
- name: Suburb - Lifestyle
  description: POIs, livability, landmarks, narrative.
paths:
  /v1/suburbs/{suburb_name}/lifestyle/livability-map:
    get:
      tags:
      - Suburb - Lifestyle
      summary: Livability scores per microburb
      description: 'All seven livability dimensions — affluence, lifestyle, hip,

        convenience, family, safety, tranquility — scored 0-100 for every

        microburb (mesh block) in the suburb, each with its human band. Averaging

        a dimension across the microburbs reproduces the suburb figure at

        ``/lifestyle/livability``. Values only; polygons come from

        ``/shapes/mesh-blocks``.


        **Exact suburb identifier required.** Exact ABS Suburb and Locality (SAL) name, e.g. `Burwood (NSW)` — many suburbs carry a state suffix. If starting from free text or an unverified bare name, first call `GET /v1/geocode/suburb?q=`, then use the exact `data[].area_name` it returns. Suburb data endpoints do not guess a state or typo-correct names.


        **Price: 20¢ per call.**'
      operationId: get_suburb_lifestyle_livability_map_v1_suburbs__suburb_name__lifestyle_livability_map_get
      parameters:
      - name: suburb_name
        in: path
        required: true
        schema:
          type: string
          title: Suburb Name
          example: Belmont North
        description: Exact ABS Suburb and Locality (SAL) name, e.g. `Burwood (NSW)` — many suburbs carry a state suffix. If starting from free text or an unverified bare name, first call `GET /v1/geocode/suburb?q=<text>`, then use the exact `data[].area_name` it returns. Suburb data endpoints do not guess a state or typo-correct names.
        example: Belmont North
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_SuburbLivabilityMap_'
              example:
                data:
                  suburb: Belmont North
                  metric: livability_scores
                  unit: score_0_100
                  definition: Seven livability dimensions scored for each mesh block ('microburb', the smallest ABS geography, ~30-60 dwellings), rescaled from the source 0-10 to 0-100. Higher is better on every dimension, safety included — it is an inverse-scaled crime score built from the same per-mesh-block crime model /crime/by-mesh-block exposes as raw rates. Averaging a dimension across the microburbs here gives the suburb figure at /lifestyle/livability. Dimensions with no score for a microburb are omitted, not zeroed.
                  dimensions:
                  - key: safety
                    label: Safety
                    description: Reported crime rates across personal, property, drug and public-order offences compared with the state average. Inverse-scaled, so a higher score means less predicted crime.
                  n_microburbs: 63
                  microburbs:
                  - mb: '10431160000'
                    street: Floraville
                    scores:
                      affluence: 43
                      lifestyle: 34
                      hip: 50
                      convenience: 46
                      family: 52
                      safety: 53
                      tranquility: 8
                    levels:
                      affluence: Low
                      lifestyle: Low
                      hip: Moderate
                      convenience: Low
                      family: Moderate
                      safety: Moderate
                      tranquility: Very low
          headers:
            X-Cost-Cents:
              description: Exact cents billed for this call.
              required: true
              schema:
                type: integer
                minimum: 0
            X-Spent-Cents:
              description: Cumulative cents Autumn reports used for this prepaid wallet.
              required: true
              schema:
                type: integer
                minimum: 0
            X-Remaining-Cents:
              description: Spendable prepaid credit left after this call.
              required: true
              schema:
                type: integer
                minimum: 0
            X-Period-End:
              description: Start of the next UTC calendar month. Prepaid credit does not expire at this timestamp.
              required: true
              schema:
                type: string
                format: date-time
            X-Balance-Cents:
              description: Compatibility alias of X-Remaining-Cents.
              required: true
              schema:
                type: integer
                minimum: 0
            X-Rate-Card-Version:
              description: Version of the endpoint rate card used for this call.
              required: true
              schema:
                type: integer
                minimum: 1
            X-Request-Id:
              description: Request identifier to quote in support requests.
              required: true
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail:
                - type: missing
                  loc:
                  - query
                  - address
                  msg: Field required
                  input: null
      x-sample-response:
        suburb: Belmont North
        metric: livability_scores
        unit: score_0_100
        definition: Seven livability dimensions scored for each mesh block ('microburb', the smallest ABS geography, ~30-60 dwellings), rescaled from the source 0-10 to 0-100. Higher is better on every dimension, safety included — it is an inverse-scaled crime score built from the same per-mesh-block crime model /crime/by-mesh-block exposes as raw rates. Averaging a dimension across the microburbs here gives the suburb figure at /lifestyle/livability. Dimensions with no score for a microburb are omitted, not zeroed.
        dimensions:
        - key: safety
          label: Safety
          description: Reported crime rates across personal, property, drug and public-order offences compared with the state average. Inverse-scaled, so a higher score means less predicted crime.
        n_microburbs: 63
        microburbs:
        - mb: '10431160000'
          street: Floraville
          scores:
            affluence: 43
            lifestyle: 34
            hip: 50
            convenience: 46
            family: 52
            safety: 53
            tranquility: 8
          levels:
            affluence: Low
            lifestyle: Low
            hip: Moderate
            convenience: Low
            family: Moderate
            safety: Moderate
            tranquility: Very low
      x-price-cents: 20
