        example: Belmont North
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_LifestyleSummary_'
              example:
                data:
                  area_level: suburb
                  area_name: Belmont North
                  has_beach: true
                  has_hospital: true
                  nearest_beach_km: 1.5
                  nearest_hospital_km: 1.4
                  nearest_shop:
                    category: Supermarket
                    dist_km: 1.2
                    name: Coles
                  nearest_train:
                    dist_km: 1.4
                    name: Jewells railway station
                  poi_categories:
                  - category: Education
                    count: 9
                    top_subtypes:
                    - count: 5
                      label: School
                    - count: 3
                      label: Childcare
                    - count: 1
                      label: Preschool
                  terrain:
                    aspect_compass: SE
                    avg_aspect_deg: 149
                    median_elevation_m: 26.0
                    median_slope_deg: 5.6
                    n_flat: 698
                    n_moderate: 830
                    n_properties: 1759
                    n_steep: 231
                    pct_steep: 13
                  total_pois: 43
