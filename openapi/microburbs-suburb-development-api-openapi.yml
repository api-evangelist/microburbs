components:
  schemas:
    CouncilIntelligenceSummary:
      properties:
        total_signals:
          type: integer
          title: Total Signals
          description: Distinct signals (deduped by title).
        active_signals:
          type: integer
          title: Active Signals
          description: Signals whose stage buckets as 'active'.
        pipeline_dollars:
          type: number
          title: Pipeline Dollars
          description: Sum of every signal's dollar_value (AUD).
        pipeline_display:
          type: string
          title: Pipeline Display
          description: Compact rendering of pipeline_dollars, e.g. '$335.6M'.
        n_types:
          type: integer
          title: N Types
          description: Distinct signal types present.
      type: object
      required:
      - total_signals
      - active_signals
      - pipeline_dollars
      - pipeline_display
      - n_types
      title: CouncilIntelligenceSummary
      description: Headline rollup over the signal list.
    ApiResponse_SuburbBuildingControls_:
      properties:
        data:
          anyOf:
          - $ref: '#/components/schemas/SuburbBuildingControls'
          - type: 'null'
          description: The endpoint's payload, or `null` when Microburbs has no value.
        available:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Available
          description: '`false` on no-data responses. Omitted on success — branch on `data !== null` if you want a single discriminator.'
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Machine-readable slug naming the no-data condition (e.g. `no_avm_for_GANSW704074813`). Stable per endpoint. Omitted on success.
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
          description: Human-readable explanation. Omitted on success.
      type: object
      title: ApiResponse[SuburbBuildingControls]
    SupplySummary:
      properties:
        new_houses:
          type: integer
          title: New Houses
          description: Total new houses across mesh blocks.
        new_units:
          type: integer
          title: New Units
          description: Total new units across mesh blocks.
        total_new:
          type: integer
          title: Total New
          description: Total new dwellings.
        pct_houses:
          anyOf:
          - type: number
          - type: 'null'
          title: Pct Houses
          description: House share of new supply (%); null when zero supply.
        pct_units:
          anyOf:
          - type: number
          - type: 'null'
          title: Pct Units
          description: Unit share of new supply (%); null when zero supply.
      type: object
      required:
      - new_houses
      - new_units
      - total_new
      title: SupplySummary
      description: Suburb rollup of new supply (sum of per-mesh-block counts).
    GeoJsonFeature:
      properties:
        type:
          type: string
          const: Feature
          title: Type
          description: Always 'Feature'.
        geometry:
          additionalProperties: true
          type: object
          title: Geometry
          description: GeoJSON geometry (Polygon or MultiPolygon).
        properties:
          additionalProperties: true
          type: object
          title: Properties
          description: Per-feature attributes — see the endpoint's example.
      type: object
      required:
      - type
      - geometry
      - properties
      title: GeoJsonFeature
      description: RFC 7946 Feature — geometry + endpoint-specific properties.
    SupplyMb:
      properties:
        mb_code:
          type: string
          title: Mb Code
          description: ABS mesh-block code.
        new_houses:
          type: integer
          title: New Houses
          description: New houses appearing in GNAF.
        new_units:
          type: integer
          title: New Units
          description: New units appearing in GNAF.
        total_new:
          type: integer
          title: Total New
          description: Total new dwellings (houses + units).
        pct_units:
