    SuburbDensity:
      properties:
        area_name:
          type: string
          title: Area Name
          description: Suburb (SAL) name.
        area_level:
          type: string
          title: Area Level
          description: Always 'suburb'.
        dwellings_per_km2:
          anyOf:
          - type: integer
          - type: 'null'
          title: Dwellings Per Km2
          description: Dwelling density from the Microburbs suburb profile — the figure the suburb report headlines. Measured around the suburb's properties, so it differs from `boundary_dwellings_per_km2`. Null for suburbs with no profile row (mostly rural / non-residential SALs).
        people_per_km2:
          anyOf:
          - type: integer
          - type: 'null'
          title: People Per Km2
          description: Population density from the same suburb profile, on the same denominator as `dwellings_per_km2`.
        density_level:
          anyOf:
          - type: string
          - type: 'null'
          title: Density Level
          description: 'Band the report labels `dwellings_per_km2` with: Low (<1,000), Mid (1,000–2,999), High (3,000+).'
        area_km2:
          anyOf:
          - type: number
          - type: 'null'
          title: Area Km2
          description: Land area of the ABS SAL boundary in km², summed from the equal-area mesh-block areas ABS publishes.
        dwellings:
          anyOf:
          - type: integer
          - type: 'null'
          title: Dwellings
          description: Census dwelling count across the suburb's mesh blocks.
        population:
          anyOf:
          - type: integer
          - type: 'null'
          title: Population
          description: Census usual-resident population across the suburb's mesh blocks.
        boundary_dwellings_per_km2:
          anyOf:
          - type: number
          - type: 'null'
          title: Boundary Dwellings Per Km2
          description: '`dwellings / area_km2` — the whole-of-boundary ratio.'
        boundary_people_per_km2:
          anyOf:
          - type: number
          - type: 'null'
          title: Boundary People Per Km2
          description: '`population / area_km2` — the whole-of-boundary ratio.'
      additionalProperties: true
      type: object
      required:
      - area_name
      - area_level
      title: SuburbDensity
      description: "Dwelling and population density for a suburb, plus the land area and\ncounts behind it.\n\nTwo density measures ship together on purpose — they are computed on\ndifferent denominators and do not agree:\n\n* ``dwellings_per_km2`` / ``people_per_km2`` are the Microburbs\n  suburb-profile figures, and are what the Microburbs suburb report\n  headlines.\n* ``boundary_dwellings_per_km2`` / ``boundary_people_per_km2`` are the\n  plain whole-of-boundary ratios — exactly ``dwellings / area_km2`` and\n  ``population / area_km2``.\n\nThe profile figures are measured around the suburb's properties, not\nacross its whole polygon, so they differ from the boundary ratios in\neither direction (Belmont North: 1,002 vs 676; Bondi: 4,970 vs 6,193).\nPick the one that matches your question: profile density for \"how\nbuilt-up is the area people actually live in\", boundary density for\n\"how many dwellings per km² of suburb\"."
      example:
        area_km2: 3.6314
        area_level: suburb
        area_name: Belmont North
        boundary_dwellings_per_km2: 675.5
        boundary_people_per_km2: 1729.4
        density_level: Mid
        dwellings: 2453
        dwellings_per_km2: 1002
        people_per_km2: 2575
        population: 6280
