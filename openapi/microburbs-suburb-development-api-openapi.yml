    ConstructionMb:
      properties:
        mb_code:
          type: string
          title: Mb Code
          description: ABS mesh-block code for the small area these readings cover, as a digit string. Mesh blocks are the smallest ABS geography — roughly a block of 30–60 dwellings.
        construction_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Construction Score
          description: 'The headline ''has building happened here'' indicator: how much the built-up index rose *net of* how much vegetation fell (`ndbi_change − ndvi_change`). A dimensionless signed index in roughly −1…+1, and in practice much nearer zero than that. Positive means hard surface gained while greenery was lost — the signature of construction; negative means the reverse. Rank mesh blocks by it rather than reading an absolute value, and remember it measures surface change, not dwellings built.'
        ndbi_change:
          anyOf:
          - type: number
          - type: 'null'
          title: Ndbi Change
          description: Change in built-up surface between 2019 and 2023 — `ndbi_2023 − ndbi_2019`, so positive means more hard surface (roofs, concrete, cleared ground) at the end of the window. Dimensionless, typically a small fraction. On its own it is confounded by dry conditions, since bare dry soil also reads as built-up; `construction_score` is the de-confounded version.
        ndbi_2019:
          anyOf:
          - type: number
          - type: 'null'
          title: Ndbi 2019
          description: 'The 2019 baseline built-up reading (NDBI — Normalised Difference Built-up Index): a dimensionless ratio in −1…+1 where higher means more hard surface and lower means more vegetation or water. Given so you can see the starting point, e.g. a bare paddock vs an already dense block.'
        ndbi_2023:
          anyOf:
          - type: number
          - type: 'null'
          title: Ndbi 2023
          description: The same built-up reading for 2023, on the identical −1…+1 scale. The difference against `ndbi_2019` is `ndbi_change`.
        ndvi_change:
          anyOf:
          - type: number
          - type: 'null'
          title: Ndvi Change
          description: Change in vegetation cover 2019→2023 (NDVI, the greenness counterpart to NDBI, also dimensionless). Negative means vegetation was lost — land cleared — which alongside a rising `ndbi_change` is the strongest sign of development. Positive means the area got greener.
      additionalProperties: true
      type: object
      required:
      - mb_code
      title: ConstructionMb
      description: 'Whether a mesh block looks like it has been built on lately, judged

        from satellite imagery.


        The method: compare two satellite readings of the same ground, one from

        2019 and one from 2023. Hard surfaces (roofs, concrete, cleared pads)

        reflect light differently from vegetation, so more hard surface plus

        less greenery is the fingerprint of building work. Every number below is

        a **dimensionless index, not a count of dwellings** — it tells you where

        something changed, never what or how many.


        Two limits worth stating to any end user: the window is a single

        2019→2023 comparison, so this is a *presence* signal rather than a

        timeline and it cannot date anything; and dry ground can read like bare

        construction ground, which is exactly why `construction_score` also

        requires vegetation to have fallen.'
    BandShare:
      properties:
        label:
          type: string
          title: Label
          description: Band label (e.g. '8.5–12m', '≤ 0.5:1').
        color:
          type: string
          title: Color
          description: Hex colour for map styling.
        pct:
          type: number
          title: Pct
          description: Share of mapped area in this band (%).
      type: object
      required:
      - label
      - color
      - pct
      title: BandShare
      description: One legend band with its share of the mapped area.
