openapi: 3.2.0
info:
  title: Microburbs Property Data Property - Context API
  summary: Suburb and property data for every Australian locality.
  description: '**One REST API for demographics, market indicators, risk scores, AVM and

    ranking — backed by 25+ years of Australian transactions and census data.**


    ```bash

    curl ''https://api.microburbs.com.au/v1/properties/GANSW704074813/profile'' \

    -H ''Authorization: Bearer test''

    ```


    ## Why Microburbs


    - **Data depth** — Demographics, lifestyle, risk, market, AVM and growth forecasts — all keyed to the same national suburb and property graph.'
  version: 1.0.0
servers:
- url: https://api.microburbs.com.au
  description: Production
security:
- BearerAuth: []
tags:
- name: Property - Context
  description: The 1km around the property — mesh-block stats, street series, nearby listings.
paths:
  /v1/properties/{gnaf_id}/context/mesh-blocks:
    get:
      tags:
      - Property - Context
      summary: Mesh blocks — 1 km buffer stats
      description: 'Mesh-block polygons within 1 km of the property (GeoJSON), each with

        avg annual growth, investor counts, modal street and median sold price.


        **Price: 30¢ per call.**'
      operationId: get_property_context_mesh_blocks_v1_properties__gnaf_id__context_mesh_blocks_get
      parameters:
      - name: gnaf_id
        in: path
        required: true
        schema:
          type: string
          title: Gnaf Id
          example: GANSW704074813
        example: GANSW704074813
      - name: geojson
        in: query
        required: false
        schema:
          type: boolean
          description: When false, geometry is dropped — every Feature keeps its per-mesh-block stats but its `geometry` is null. Use it for the stats surface without the polygons (default true — response unchanged).
          default: true
          title: Geojson
        description: When false, geometry is dropped — every Feature keeps its per-mesh-block stats but its `geometry` is null. Use it for the stats surface without the polygons (default true — response unchanged).
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_MeshBlocksContext_'
              example:
                data:
                  buffer_km: 1.0
                  center_lat: -33.802479
                  center_lng: 151.219715
                  gnaf_id: GANSW704360755
                  mesh_blocks:
                    features:
                    - geometry:
                        coordinates:
                        - - - 151.2185
                            - -33.8018
                          - - 151.2199
                            - -33.8018
                          - - 151.2199
                            - -33.8031
                          - - 151.2185
                            - -33.8031
                          - - 151.2185
                            - -33.8018
                        type: Polygon
                      properties:
                        mb: '10693650000'
                        modal_street: THE BULWARK
                        avg_annual_growth: 0.061
                        total_properties: 42
                        rental_properties: 9
                        investor_pct: 21.43
                        median_sold_price: 3350000.0
                      type: Feature
                    type: FeatureCollection
          headers:
            X-Cost-Cents:
              description: Exact cents billed for this call.
              required: true
              schema:
                type: integer
                minimum: 0
            X-Spent-Cents:
              description: Cumulative cents Autumn reports used for this prepaid wallet.
              required: true
              schema:
                type: integer
                minimum: 0
            X-Remaining-Cents:
              description: Spendable prepaid credit left after this call.
              required: true
              schema:
                type: integer
                minimum: 0
            X-Period-End:
              description: Start of the next UTC calendar month. Prepaid credit does not expire at this timestamp.
              required: true
              schema:
                type: string
                format: date-time
            X-Balance-Cents:
              description: Compatibility alias of X-Remaining-Cents.
              required: true
              schema:
                type: integer
                minimum: 0
            X-Rate-Card-Version:
              description: Version of the endpoint rate card used for this call.
              required: true
              schema:
                type: integer
                minimum: 1
            X-Request-Id:
              description: Request identifier to quote in support requests.
              required: true
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail:
                - type: missing
                  loc:
                  - query
                  - address
                  msg: Field required
                  input: null
      x-price-cents: 30
  /v1/properties/{gnaf_id}/context/street-bedroom-series:
    get:
      tags:
      - Property - Context
      summary: Bedroom-band price series
      description: 'The subject''s bedroom band (bed count from listing history) and the

        suburb''s 10-year price series for that band.


        **Price: 15¢ per call.**'
      operationId: get_property_context_street_bedroom_series_v1_properties__gnaf_id__context_street_bedroom_series_get
      parameters:
      - name: gnaf_id
        in: path
        required: true
        schema:
          type: string
          title: Gnaf Id
          example: GANSW704074813
        example: GANSW704074813
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_StreetBedroomSeries_'
              example:
                data:
                  band_label: 4-bed house
                  bedrooms: 4
                  gnaf_id: GANSW704360755
                  latest_date: '2026-06-28'
                  latest_value: 4400000.0
                  property_type: house
                  series:
                  - date: '2026-06-28'
                    value: 4400000.0
                  suburb: Castlecrag
          headers:
            X-Cost-Cents:
              description: Exact cents billed for this call.
              required: true
              schema:
                type: integer
                minimum: 0
            X-Spent-Cents:
              description: Cumulative cents Autumn reports used for this prepaid wallet.
              required: true
              schema:
                type: integer
                minimum: 0
            X-Remaining-Cents:
              description: Spendable prepaid credit left after this call.
              required: true
              schema:
                type: integer
                minimum: 0
            X-Period-End:
              description: Start of the next UTC calendar month. Prepaid credit does not expire at this timestamp.
              required: true
              schema:
                type: string
                format: date-time
            X-Balance-Cents:
              description: Compatibility alias of X-Remaining-Cents.
              required: true
              schema:
                type: integer
                minimum: 0
            X-Rate-Card-Version:
              description: Version of the endpoint rate card used for this call.
              required: true
              schema:
                type: integer
                minimum: 1
            X-Request-Id:
              description: Request identifier to quote in support requests.
              required: true
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail:
                - type: missing
                  loc:
                  - query
                  - address
                  msg: Field required
                  input: null
      x-price-cents: 15
  /v1/properties/{gnaf_id}/context/nearby-for-sale:
    get:
      tags:
      - Property - Context
      summary: Nearby for-sale listings
      description: 'Currently for-sale listings within `radius_km` of the property

        (newest first, max 30) with AVM and rent-yield comparison.


        **Price: 20¢ per call.**'
      operationId: get_property_context_nearby_for_sale_v1_properties__gnaf_id__context_nearby_for_sale_get
      parameters:
      - name: gnaf_id
        in: path
        required: true
        schema:
          type: string
          title: Gnaf Id
          example: GANSW704074813
        example: GANSW704074813
      - name: radius_km
        in: query
        required: false
        schema:
          type: number
          maximum: 5.0
          minimum: 0.1
          description: Search radius in km (0.1-5).
          default: 1.0
          title: Radius Km
        description: Search radius in km (0.1-5).
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_NearbyForSale_'
              example:
                data:
                  center_lat: -33.802479
                  center_lng: 151.219715
                  count: 2
                  gnaf_id: GANSW704360755
                  listings:
                  - address: 8 The Bulwark, Castlecrag NSW 2068
                    avm: 4380000
                    bathrooms: 2
                    bedrooms: 4
                    discount_pct: 2.7
                    gnaf_pid: GANSW704357382
                    land_size: 696
                    lat: -33.8019
                    listing_date: '2026-06-14'
                    lng: 151.2205
                    price: 4500000.0
                    price_label: $4,500,000 Guide
                    property_type: House
                    weekly_rent: 1850.0
                    yield_pct: 2.1
                  radius_km: 1.0
          headers:
            X-Cost-Cents:
              description: Exact cents billed for this call.
              required: true
              schema:
                type: integer
                minimum: 0
            X-Spent-Cents:
              description: Cumulative cents Autumn reports used for this prepaid wallet.
              required: true
              schema:
                type: integer
                minimum: 0
            X-Remaining-Cents:
              description: Spendable prepaid credit left after this call.
              required: true
              schema:
                type: integer
                minimum: 0
            X-Period-End:
              description: Start of the next UTC calendar month. Prepaid credit does not expire at this timestamp.
              required: true
              schema:
                type: string
                format: date-time
            X-Balance-Cents:
              description: Compatibility alias of X-Remaining-Cents.
              required: true
              schema:
                type: integer
                minimum: 0
            X-Rate-Card-Version:
              description: Version of the endpoint rate card used for this call.
              required: true
              schema:
                type: integer
                minimum: 1
            X-Request-Id:
              description: Request identifier to quote in support requests.
              required: true
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail:
                - type: missing
                  loc:
                  - query
                  - address
                  msg: Field required
                  input: null
      x-price-cents: 20
  /v1/properties/{gnaf_id}/street/profile:
    get:
      tags:
      - Property - Context
      summary: Street profile — this property's street vs its suburb
      description: 'The property''s own street: current median price, 2/4/8-year price

        forecasts, realised growth, sale/rental turnover, renter share and

        houses/units on the street — plus the suburb-wide medians to judge it

        against and the street''s rank on 4-year forecast growth.


        404s when the street has no forecast row rather than falling back to

        suburb-wide figures, which would answer a different question.


        **Price: 20¢ per call.**'
      operationId: get_property_street_profile_v1_properties__gnaf_id__street_profile_get
      parameters:
      - name: gnaf_id
        in: path
        required: true
        schema:
          type: string
          title: Gnaf Id
          example: GANSW704074813
        example: GANSW704074813
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_PropertyStreetProfile_'
              example:
                data:
                  gnaf_id: GANSW717662275
                  address: 15 Rengor Close
                  suburb: Belmont North
                  street: Rengor Close
                  streets_in_suburb: 81
                  profile:
                    street: Rengor Cl
                    title: Rengor Close
                    current_price: 1300000.0
                    n_sales: 47
                    target_2y: 1694197.26
                    annual_2y: 14.2
                    target_4y: 1979978.08
                    annual_4y: 11.1
                    target_8y: 2532146.5
                    annual_8y: 8.7
                    past_growth_pct: 2.82
                    confidence: Medium
                    history:
                    - year: 2024
                      price: 1002844.58
                      suburb_med: 866399
                    - year: 2025
                      price: 1300000.0
                      suburb_med: 948908
                    - year: 2026
                      price: 1300000.0
                      suburb_med: 1040068
                    houses_on_street: 12
                    units_on_street: 0
                    median_house_rent_week: 986.5
                    sale_turnover: Every 9.2 years (very high turnover)
                    sale_turnover_years: 9.2
                    renters_pct: 0%
                    renters_pct_num: 0.0
                  suburb_medians:
                    past_growth_pct: 3.23
                    annual_4y: 6.3
                    annual_8y: 4.6
                    sale_turnover_years: 14.4
                    rental_turnover_years: 6.0
                    renters_pct: 16.0
                  forecast_rank:
                    rank: 1
                    total: 81
                    percentile_from_top: 1
                    band: Top 1%
                    tercile: upper third
          headers:
            X-Cost-Cents:
              description: Exact cents billed for this call.
              required: true
              schema:
                type: integer
                minimum: 0
            X-Spent-Cents:
              description: Cumulative cents Autumn reports used for this prepaid wallet.
              required: true
              schema:
                type: integer
                minimum: 0
            X-Remaining-Cents:
              description: Spendable prepaid credit left after this call.
              required: true
              schema:
                type: integer
                minimum: 0
            X-Period-End:
              description: Start of the next UTC calendar month. Prepaid credit does not expire at this timestamp.
              required: true
              schema:
                type: string
                format: date-time
            X-Balance-Cents:
              description: Compatibility alias of X-Remaining-Cents.
              required: true
              schema:
                type: integer
                minimum: 0
            X-Rate-Card-Version:
              description: Version of the endpoint rate card used for this call.
              required: true
              schema:
                type: integer
                minimum: 1
            X-Request-Id:
              description: Request identifier to quote in support requests.
              required: true
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail:
                - type: missing
                  loc:
                  - query
                  - address
                  msg: Field required
                  input: null
      x-sample-response:
        gnaf_id: GANSW717662275
