          past_growth_pct: 2.82
          confidence: Medium
          history:
          - year: 2024
            price: 1002844.58
            suburb_med: 866399
          - year: 2025
            price: 1300000.0
            suburb_med: 948908
          - year: 2026
            price: 1300000.0
            suburb_med: 1040068
          houses_on_street: 12
          units_on_street: 0
          median_house_rent_week: 986.5
          sale_turnover: Every 9.2 years (very high turnover)
          sale_turnover_years: 9.2
          renters_pct: 0%
          renters_pct_num: 0.0
        suburb_medians:
          past_growth_pct: 3.23
