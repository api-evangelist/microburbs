      x-price-cents: 20
components:
  schemas:
    ApiResponse_MeshBlocksContext_:
      properties:
        data:
          anyOf:
          - $ref: '#/components/schemas/MeshBlocksContext'
          - type: 'null'
          description: The endpoint's payload, or `null` when Microburbs has no value.
        available:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Available
          description: '`false` on no-data responses. Omitted on success — branch on `data !== null` if you want a single discriminator.'
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Machine-readable slug naming the no-data condition (e.g. `no_avm_for_GANSW704074813`). Stable per endpoint. Omitted on success.
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
          description: Human-readable explanation. Omitted on success.
      type: object
      title: ApiResponse[MeshBlocksContext]
    PropertyStreetProfile:
      properties:
        gnaf_id:
          type: string
          title: Gnaf Id
          description: GNAF persistent identifier of the property.
        address:
          type: string
          title: Address
          description: Street address of the property, e.g. '15 Rengor Close'.
        suburb:
          type: string
          title: Suburb
          description: Suburb (SAL) name.
        street:
          type: string
          title: Street
          description: The property's street, suffix-expanded, e.g. 'Rengor Close'.
        streets_in_suburb:
          type: integer
          title: Streets In Suburb
          description: Forecastable streets in the suburb (the benchmark population).
        profile:
          $ref: '#/components/schemas/StreetProfileRow'
          description: The property's own street.
        suburb_medians:
          $ref: '#/components/schemas/StreetSuburbMedians'
          description: Suburb-wide medians to judge the street against.
        forecast_rank:
          anyOf:
          - $ref: '#/components/schemas/StreetForecastRank'
          - type: 'null'
          description: Rank of the street's 4-year forecast within the suburb. None when the street has no 4-year forecast or fewer than two streets rank.
      additionalProperties: true
      type: object
      required:
      - gnaf_id
      - address
      - suburb
      - street
      - streets_in_suburb
      - profile
      - suburb_medians
      title: PropertyStreetProfile
      description: The property's own street, benchmarked against its suburb.
      example:
        address: 15 Rengor Close
        forecast_rank:
          band: Top 1%
          percentile_from_top: 1
          rank: 1
          tercile: upper third
          total: 81
        gnaf_id: GANSW717662275
        profile:
          annual_2y: 14.2
          annual_4y: 11.1
          annual_8y: 8.7
          confidence: Medium
          current_price: 1300000.0
          history:
          - price: 1002844.58
            suburb_med: 866399
            year: 2024
          - price: 1300000.0
            suburb_med: 948908
            year: 2025
          - price: 1300000.0
            suburb_med: 1040068
            year: 2026
          houses_on_street: 12
          median_house_rent_week: 986.5
          n_sales: 47
          past_growth_pct: 2.82
          renters_pct: 0%
          renters_pct_num: 0.0
          sale_turnover: Every 9.2 years (very high turnover)
          sale_turnover_years: 9.2
          street: Rengor Cl
          target_2y: 1694197.26
          target_4y: 1979978.08
          target_8y: 2532146.5
          title: Rengor Close
          units_on_street: 0
        street: Rengor Close
        streets_in_suburb: 81
        suburb: Belmont North
        suburb_medians:
          annual_4y: 6.3
          annual_8y: 4.6
          past_growth_pct: 3.23
          rental_turnover_years: 6.0
          renters_pct: 16.0
          sale_turnover_years: 14.4
    MeshBlockStats:
      properties:
        mb:
          type: string
          title: Mb
          description: ABS 2021 mesh-block code.
        modal_street:
          anyOf:
          - type: string
          - type: 'null'
          title: Modal Street
          description: Most common street name inside the mesh block.
        avg_annual_growth:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Annual Growth
          description: Average annual price growth for properties in the mesh block, as a decimal fraction per year (0.061 = 6.1%/yr) — same scale as the suburb investor-concentration endpoint.
        total_properties:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Properties
          description: Total residential properties in the mesh block.
        rental_properties:
          anyOf:
          - type: integer
          - type: 'null'
          title: Rental Properties
          description: Properties identified as rentals in the mesh block.
        investor_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Investor Pct
          description: Investor share = rental_properties / total_properties × 100, as a percentage 0-100 (21.43 = 21.43%).
        median_sold_price:
          anyOf:
          - type: number
          - type: 'null'
          title: Median Sold Price
          description: Median sold price (AUD) across the suburb's last ~12 months of house sales that geocode into this mesh block (min 2 sales, else null).
      additionalProperties: true
      type: object
      required:
      - mb
      title: MeshBlockStats
      description: Per-mesh-block stats attached to each GeoJSON feature.
    NearbyForSale:
      properties:
        gnaf_id:
          type: string
          title: Gnaf Id
          description: Subject property GNAF id.
        center_lat:
          type: number
          title: Center Lat
          description: Subject property latitude.
        center_lng:
          type: number
          title: Center Lng
          description: Subject property longitude.
        radius_km:
          type: number
          title: Radius Km
          description: Search radius used (km).
        count:
          type: integer
          title: Count
          description: Number of listings returned (0-30).
        listings:
          items:
            $ref: '#/components/schemas/NearbyForSaleListing'
          type: array
          title: Listings
          description: For-sale listings, newest listing date first.
      additionalProperties: true
      type: object
      required:
      - gnaf_id
      - center_lat
      - center_lng
      - radius_km
      - count
      - listings
      title: NearbyForSale
      description: 'Currently for-sale listings within the requested radius of the

        property (newest first, max 30), with AVM / rent-yield comparison.'
      example:
        center_lat: -33.802479
        center_lng: 151.219715
        count: 2
        gnaf_id: GANSW704360755
        listings:
        - address: 8 The Bulwark, Castlecrag NSW 2068
          avm: 4380000
          bathrooms: 2
          bedrooms: 4
          discount_pct: 2.7
          gnaf_pid: GANSW704357382
          land_size: 696
          lat: -33.8019
          listing_date: '2026-06-14'
          lng: 151.2205
          price: 4500000.0
          price_label: $4,500,000 Guide
          property_type: House
          weekly_rent: 1850.0
          yield_pct: 2.1
        radius_km: 1.0
    StreetProfileRow:
      properties:
        street:
          type: string
          title: Street
          description: Street name as stored in the forecast payload, e.g. 'Rengor Cl'.
        title:
          type: string
          title: Title
          description: Display name with the street suffix expanded, e.g. 'Rengor Close'.
        current_price:
          type: number
          title: Current Price
          description: Current median house price for the street (AUD) — the real sold median, not a model estimate.
        n_sales:
          type: integer
          title: N Sales
          description: Number of sales underpinning the street model.
        target_2y:
          anyOf:
          - type: number
          - type: 'null'
          title: Target 2Y
          description: Forecast street price in 2 years (AUD).
        annual_2y:
          anyOf:
          - type: number
          - type: 'null'
          title: Annual 2Y
          description: Forecast annual growth over the next 2 years (percent, e.g. 8.0 = 8%/yr).
        target_4y:
          anyOf:
          - type: number
          - type: 'null'
          title: Target 4Y
          description: Forecast street price in 4 years (AUD).
        annual_4y:
          anyOf:
          - type: number
          - type: 'null'
          title: Annual 4Y
          description: Forecast annual growth over the next 4 years (percent).
        target_8y:
          anyOf:
          - type: number
          - type: 'null'
          title: Target 8Y
          description: Forecast street price in 8 years (AUD).
        annual_8y:
          anyOf:
          - type: number
          - type: 'null'
          title: Annual 8Y
          description: Forecast annual growth over the next 8 years (percent).
        past_growth_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Past Growth Pct
          description: Realised annual growth (CAGR, percent) across the street's price history. None when the history has fewer than two priced years.
        confidence:
          type: string
          title: Confidence
          description: 'Confidence in the street model from its sample size: ''High'' (>=50 sales), ''Medium'' (>=15), ''Low'' otherwise.'
        history:
          items:
            $ref: '#/components/schemas/app__schemas__property_planning_v6__StreetHistoryPoint'
          type: array
          title: History
          description: Year-by-year modelled price history vs the suburb median.
        houses_on_street:
          anyOf:
          - type: integer
          - type: 'null'
          title: Houses On Street
          description: Number of houses on the street.
        units_on_street:
          anyOf:
          - type: integer
          - type: 'null'
          title: Units On Street
          description: Number of units on the street.
        median_house_rent_week:
          anyOf:
          - type: number
          - type: 'null'
          title: Median House Rent Week
          description: Median weekly house rent on the street (AUD/week).
        sale_turnover:
          anyOf:
          - type: string
          - type: 'null'
          title: Sale Turnover
          description: Plain-language sale-turnover rate, e.g. 'Every 12.0 years (average turnover)'.
        sale_turnover_years:
          anyOf:
          - type: number
          - type: 'null'
          title: Sale Turnover Years
          description: '`sale_turnover` as a number of years.'
        rental_turnover:
          anyOf:
          - type: string
          - type: 'null'
          title: Rental Turnover
          description: Plain-language rental-turnover rate.
        rental_turnover_years:
          anyOf:
          - type: number
          - type: 'null'
          title: Rental Turnover Years
          description: '`rental_turnover` as a number of years.'
        renters_pct:
