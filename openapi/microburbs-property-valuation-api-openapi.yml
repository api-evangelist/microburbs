    NegativeGearing:
      properties:
        level:
          type: string
          enum:
          - property
          - mb
          - suburb
          title: Level
          description: 'Resolution the stat was found at: per-property, mesh-block, or suburb.'
        is_negatively_geared:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Negatively Geared
          description: Rent minus interest at 80% LVR is negative (property level).
        net_cashflow_80lvr:
          anyOf:
          - type: number
          - type: 'null'
          title: Net Cashflow 80Lvr
          description: Net cashflow AUD/yr at the headline 80% LVR (property level).
        net_cashflow_105lvr:
          anyOf:
          - type: number
          - type: 'null'
          title: Net Cashflow 105Lvr
          description: Net cashflow AUD/yr at the 105% equity-release scenario (property level).
        net_cashflow_80lvr_wk:
          anyOf:
          - type: number
          - type: 'null'
          title: Net Cashflow 80Lvr Wk
          description: Net cashflow AUD/wk at 80% LVR (property level).
        gross_yield_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Gross Yield Pct
          description: Gross rental yield, already a percent (property level).
        lvr_default:
          anyOf:
          - type: number
          - type: 'null'
          title: Lvr Default
          description: Headline-scenario LVR, 0-1 (property level).
        rent_estimate_suspect:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Rent Estimate Suspect
          description: Upstream rent under-predicts — yield/cashflow indicative only (property level).
        sal:
          anyOf:
          - type: string
          - type: 'null'
          title: Sal
          description: Suburb (SAL) name (mb/suburb level).
        exposure:
          anyOf:
          - type: number
          - type: 'null'
          title: Exposure
          description: Share of dwellings held by negatively-geared landlords, 0-1 (mb/suburb level).
        tier:
          anyOf:
          - type: string
          - type: 'null'
          title: Tier
          description: Exposure tier (e.g. 'Very high', 'High', 'Medium', 'Low') (mb/suburb level).
        private_rental_share:
          anyOf:
          - type: number
          - type: 'null'
          title: Private Rental Share
          description: Private-rental share of dwellings, 0-1 (suburb level only).
        share_tax_loss_making:
          anyOf:
          - type: number
          - type: 'null'
          title: Share Tax Loss Making
          description: Share of investor candidates that are tax-loss-making, 0-1 (mb/suburb level).
        n_investor_candidates:
          anyOf:
          - type: integer
          - type: 'null'
          title: N Investor Candidates
          description: Number of investor candidates scored (mb/suburb level).
        realistic_lvr:
          anyOf:
          - type: number
          - type: 'null'
          title: Realistic Lvr
          description: Mean LVR among candidates, 0-1 (mb level only).
      additionalProperties: true
      type: object
      required:
      - level
      title: NegativeGearing
      description: 'Negative-gearing stat at the finest level available.


        ``level=''property''`` carries the per-property cashflow fields;

        ``level=''mb''`` / ``level=''suburb''`` carry the area-exposure fields.

        Fields for the other level are null.'
      example:
        gross_yield_pct: 0.57
        is_negatively_geared: true
        level: property
        lvr_default: 0.8
        net_cashflow_105lvr: -255336.0
        net_cashflow_80lvr: -189996.0
        net_cashflow_80lvr_wk: -3654.0
        rent_estimate_suspect: true
