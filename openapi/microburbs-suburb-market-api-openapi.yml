  /v1/suburbs/{suburb_name}/market/median-price-map:
    get:
      tags:
      - Suburb - Market
      summary: Median sale price per microburb
      description: 'Median house price for every microburb (mesh block) in the suburb, with

        its modal street name, plus the dearest and cheapest pockets. Values only —

        the matching polygons come from ``/shapes/mesh-blocks``.


        **Exact suburb identifier required.** Exact ABS Suburb and Locality (SAL) name, e.g. `Burwood (NSW)` — many suburbs carry a state suffix. If starting from free text or an unverified bare name, first call `GET /v1/geocode/suburb?q=`, then use the exact `data[].area_name` it returns. Suburb data endpoints do not guess a state or typo-correct names.


        **Price: 20¢ per call.**'
      operationId: get_suburb_market_median_price_map_v1_suburbs__suburb_name__market_median_price_map_get
      parameters:
      - name: suburb_name
        in: path
        required: true
        schema:
          type: string
          title: Suburb Name
          example: Belmont North
        description: Exact ABS Suburb and Locality (SAL) name, e.g. `Burwood (NSW)` — many suburbs carry a state suffix. If starting from free text or an unverified bare name, first call `GET /v1/geocode/suburb?q=<text>`, then use the exact `data[].area_name` it returns. Suburb data endpoints do not guess a state or typo-correct names.
        example: Belmont North
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_SuburbMedianPriceMap_'
              example:
                data:
                  suburb: Belmont North
                  metric: median_house_price
                  unit: AUD
                  as_of: '2026-08-09'
                  definition: Modelled median (50th-percentile) house price for the mesh block, from the modelled per-microburb price surface. Mesh block = 'microburb', the smallest ABS geography (~30-60 dwellings). Mesh blocks with too little signal are absent rather than zero.
                  n_microburbs: 63
                  microburbs:
                  - mb: '10434032000'
                    street: Pacific
                    median_price: 3843000
                  highest:
                    mb: '10434032000'
                    street: Pacific
                    median_price: 3843000
                  lowest:
                    mb: '10439043000'
                    street: Lentara
                    median_price: 625900
          headers:
            X-Cost-Cents:
              description: Exact cents billed for this call.
              required: true
              schema:
                type: integer
                minimum: 0
            X-Spent-Cents:
              description: Cumulative cents Autumn reports used for this prepaid wallet.
              required: true
              schema:
                type: integer
                minimum: 0
            X-Remaining-Cents:
              description: Spendable prepaid credit left after this call.
              required: true
