  /v1/suburbs/{suburb_name}/market/all:
    get:
      tags:
      - Suburb - Market
      summary: Core market indicators — bundle
      description: 'The eight headline market indicators in one call: median sale price and

        median rent (each with its full history), 5-year price growth, gross yield,

        days on market, and transaction volume.


        **This is a core set, not every market endpoint.** The `Suburb - Market`

        family has 29 endpoints; this bundles 8 of them, priced sum-of-parts. The

        path is `/market/all` for historical reasons — it is not "all". Supply,

        vacancy, growth drivers, affordability, mortgage stress, investor

        concentration, land values, repeat sales, bedroom stats and the per-mesh-block

        maps are separate calls, so you only pay for what you ask for.


        **Exact suburb identifier required.** Exact ABS Suburb and Locality (SAL) name, e.g. `Burwood (NSW)` — many suburbs carry a state suffix. If starting from free text or an unverified bare name, first call `GET /v1/geocode/suburb?q=`, then use the exact `data[].area_name` it returns. Suburb data endpoints do not guess a state or typo-correct names.


        **Price: 108¢ per call.**'
      operationId: get_suburb_market_all_v1_suburbs__suburb_name__market_all_get
      parameters:
      - name: suburb_name
        in: path
        required: true
        schema:
          type: string
          title: Suburb Name
          example: Belmont North
        description: Exact ABS Suburb and Locality (SAL) name, e.g. `Burwood (NSW)` — many suburbs carry a state suffix. If starting from free text or an unverified bare name, first call `GET /v1/geocode/suburb?q=<text>`, then use the exact `data[].area_name` it returns. Suburb data endpoints do not guess a state or typo-correct names.
        example: Belmont North
