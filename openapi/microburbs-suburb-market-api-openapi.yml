    SuburbYieldMap:
      properties:
        suburb:
          type: string
          title: Suburb
          description: Canonical SAL name.
        metric:
          type: string
          title: Metric
          description: Always 'gross_rental_yield_house'.
        unit:
          type: string
          title: Unit
          description: Always 'percent' — note /market/yield-pct reports the same metric as a decimal.
        as_of:
          anyOf:
          - type: string
          - type: 'null'
          title: As Of
          description: Date of the surfaces (YYYY-MM-DD).
        definition:
          type: string
          title: Definition
          description: How the figure is derived.
        n_microburbs:
          type: integer
          title: N Microburbs
          description: Microburbs with both a rent and a price.
        microburbs:
          items:
            $ref: '#/components/schemas/YieldMb'
          type: array
          title: Microburbs
          description: Per-microburb yields, highest first.
        highest:
          anyOf:
          - $ref: '#/components/schemas/YieldMb'
          - type: 'null'
          description: Highest-yielding microburb. None when there is no spread.
        lowest:
          anyOf:
          - $ref: '#/components/schemas/YieldMb'
          - type: 'null'
          description: Lowest-yielding microburb. None when there is no spread.
      additionalProperties: true
      type: object
      required:
      - suburb
      - metric
      - unit
      - definition
      - n_microburbs
      - microburbs
      title: SuburbYieldMap
      description: Per-microburb gross rental yield — the report's `yield` overlay.
      example:
        as_of: '2026-08-16'
        definition: 'Gross rental yield for the mesh block: modelled median weekly house rent x 52, divided by the modelled median house price, as a percentage. Same definition as the suburb-wide yield at /market/yield-pct (which reports it as a decimal); gross, so before rates, strata, management or vacancy. Microburbs missing either the rent or the price are absent, not zero.'
        highest:
          gross_yield_pct: 6.65
          mb: '10439020000'
          median_price: 892000
          street: Floraville
          weekly_rent: 1140
        lowest:
          gross_yield_pct: 1.85
          mb: '10434330000'
          median_price: 1600000
          street: Arlington
          weekly_rent: 570
        metric: gross_rental_yield_house
        microburbs:
        - gross_yield_pct: 6.65
          mb: '10439020000'
          median_price: 892000
          street: Floraville
          weekly_rent: 1140
        n_microburbs: 58
        suburb: Belmont North
        unit: percent
    RankedValue:
