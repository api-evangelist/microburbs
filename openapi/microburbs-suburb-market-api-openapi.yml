    SuburbLandValues:
      properties:
        area_name:
          type: string
          title: Area Name
          description: Suburb (SAL) name.
        area_level:
          type: string
          title: Area Level
          description: Always 'suburb' for these endpoints.
        median_lv_sqm:
          anyOf:
          - type: number
          - type: 'null'
          title: Median Lv Sqm
          description: Median land value per square metre (AUD).
        median_land_size:
          anyOf:
          - type: number
          - type: 'null'
          title: Median Land Size
          description: Median lot size (sqm).
        median_land_value:
          anyOf:
          - type: integer
          - type: 'null'
          title: Median Land Value
          description: Median total parcel land value (AUD).
        median_price:
          anyOf:
          - type: integer
          - type: 'null'
          title: Median Price
          description: Median property price (AUD) — denominator of the land share.
        land_share_of_price:
          anyOf:
          - type: number
          - type: 'null'
          title: Land Share Of Price
          description: Land value as share of property price (decimal, 0.55 = 55%).
        n_parcels:
          anyOf:
          - type: integer
          - type: 'null'
          title: N Parcels
          description: Parcels behind the suburb medians.
        mbs:
          items:
            $ref: '#/components/schemas/LandValueMb'
          type: array
          title: Mbs
          description: Per-mesh-block land values.
      additionalProperties: true
      type: object
      required:
      - area_name
      - area_level
      - mbs
      title: SuburbLandValues
      description: Suburb land-value medians + per-mesh-block $/sqm.
      example:
        area_level: suburb
        area_name: Belmont North
        land_share_of_price: 0.546
        mbs:
        - lv_sqm: 748.2
          mb: '10431160000'
          n_parcels: 21
        median_land_size: 645.0
        median_land_value: 426078
        median_lv_sqm: 657.0
        median_price: 780000
        n_parcels: 1549
    SuburbMedianPriceMap:
      properties:
        suburb:
          type: string
          title: Suburb
          description: Canonical SAL name.
        metric:
          type: string
          title: Metric
          description: Always 'median_house_price'.
        unit:
          type: string
          title: Unit
          description: Always 'AUD'.
        as_of:
          anyOf:
          - type: string
          - type: 'null'
          title: As Of
          description: Date of the price surface (YYYY-MM-DD).
        definition:
          type: string
          title: Definition
          description: How the figure is derived.
        n_microburbs:
          type: integer
          title: N Microburbs
          description: Microburbs with a price.
        microburbs:
          items:
            $ref: '#/components/schemas/MedianPriceMb'
          type: array
          title: Microburbs
          description: Per-microburb prices, highest first.
        highest:
          anyOf:
          - $ref: '#/components/schemas/MedianPriceMb'
          - type: 'null'
          description: Dearest microburb. None when there is no spread.
        lowest:
          anyOf:
          - $ref: '#/components/schemas/MedianPriceMb'
          - type: 'null'
          description: Cheapest microburb. None when there is no spread.
      additionalProperties: true
      type: object
      required:
      - suburb
      - metric
      - unit
      - definition
      - n_microburbs
      - microburbs
      title: SuburbMedianPriceMap
      description: Per-microburb median house price — the report's `mb_price` overlay.
      example:
        as_of: '2026-08-09'
        definition: Modelled median (50th-percentile) house price for the mesh block, from the modelled per-microburb price surface. Mesh block = 'microburb', the smallest ABS geography (~30-60 dwellings). Mesh blocks with too little signal are absent rather than zero.
        highest:
          mb: '10434032000'
          median_price: 3843000
          street: Pacific
        lowest:
          mb: '10439043000'
          median_price: 625900
          street: Lentara
        metric: median_house_price
        microburbs:
        - mb: '10434032000'
          median_price: 3843000
          street: Pacific
        n_microburbs: 63
        suburb: Belmont North
        unit: AUD
