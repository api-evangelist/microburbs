    PriceGrowthAll:
      properties:
        area_name:
          type: string
          title: Area Name
          description: Suburb (SAL) name.
        area_level:
          type: string
          title: Area Level
          description: Always 'suburb' for these endpoints.
        house:
          anyOf:
          - additionalProperties:
              anyOf:
              - type: number
              - type: 'null'
            type: object
          - type: 'null'
          title: House
          description: 'House compound growth by horizon: keys ''1yr'',''3yr'',''5yr'',''10yr'' (decimal).'
        unit:
          anyOf:
          - additionalProperties:
              anyOf:
              - type: number
              - type: 'null'
            type: object
          - type: 'null'
          title: Unit
          description: Unit compound growth by horizon, same keys (decimal).
        as_of:
          anyOf:
          - type: string
          - type: 'null'
          title: As Of
          description: Date of the most recent observation (YYYY-MM-DD).
      additionalProperties: true
      type: object
      required:
      - area_name
      - area_level
      title: PriceGrowthAll
      description: 'Past compound sale-price growth over 1 / 3 / 5 / 10 years, by type.


        `house` and `unit` are objects keyed by horizon — `''1yr''`, `''3yr''`,

        `''5yr''`, `''10yr''` — each a decimal (0.42 = +42%). The 3y / 10y values are

        the same figures the Suburb Finder ranks on (`growth3yrCagr` /

        `growth10yrCagr`).'
      example:
        area_level: suburb
        area_name: Belmont North
        as_of: '2026-05-24'
        house:
          10yr: 1.24
          1yr: 0.08
          3yr: 0.36
          5yr: 0.684
        unit:
          10yr: 0.61
          1yr: 0.02
          3yr: 0.04
          5yr: 0.06
