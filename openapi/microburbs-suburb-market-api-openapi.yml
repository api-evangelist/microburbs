          type: string
          title: Category
          description: 'Report section the driver belongs to: ''supply_demand'', ''market'', ''risks'' or ''demographics''.'
        key:
          type: string
          title: Key
          description: Stable machine identifier for the indicator.
        indicator:
          type: string
          title: Indicator
          description: Human label, matching the report's row label.
        value:
          anyOf:
          - type: number
          - type: 'null'
          title: Value
          description: The suburb's own value for this indicator (see `unit`).
        unit:
          anyOf:
          - type: string
          - type: 'null'
          title: Unit
          description: Unit of `value` — e.g. 'months', 'fraction', 'AUD', '%', 'ANEF', 'score_0_100'.
        band:
          anyOf:
          - type: string
          - type: 'null'
          title: Band
          description: 'The band the suburb''s value fell into: a numeric interval for threshold-model drivers, ''present''/''absent'' for risks, or the tier name for cultural integration.'
        direction:
          type: string
          title: Direction
          description: '''positive'', ''negative'' or ''neutral'' — the tone the report gives the chip.'
        impact_pct_per_year:
          type: number
          title: Impact Pct Per Year
          description: Capital-growth differential attributed to this indicator, in percentage points, exactly as the report renders it.
        horizon_years:
          anyOf:
          - type: integer
          - type: 'null'
          title: Horizon Years
          description: Window the differential was measured over. Threshold-model studies run 2 or 4 years and the report presents the raw differential as an annual rate; the cultural-integration model annualises its 4-year figure first; risk coefficients are already per-year.
        basis:
          anyOf:
          - type: string
          - type: 'null'
          title: Basis
          description: 'Control group the differential is relative to: ''nat_rel'' (national), ''gccsa_rel'' (capital-city region), ''nat_bin'' (national tier), ''matched_control'' (matched address pairs).'
        source:
          type: string
          title: Source
          description: 'Model the row came from: ''thresholds_v3_prod'', ''dbyd_matched_cg'' or ''cultural_integration_sal''.'
      type: object
      required:
      - category
      - key
      - indicator
      - direction
      - impact_pct_per_year
      - source
      title: GrowthDriver
      description: One indicator and the capital-growth differential attributed to it.
