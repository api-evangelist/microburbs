    MarketAll:
      properties:
        median_sale_price:
          anyOf:
          - $ref: '#/components/schemas/MedianSalePrice'
          - type: 'null'
          description: Latest median sale price, houses and units separately, in AUD.
        median_sale_price_series:
          anyOf:
          - $ref: '#/components/schemas/MedianSalePriceSeries'
          - type: 'null'
          description: Monthly history of the median sale price, for charting the trend.
        median_rent:
          anyOf:
          - $ref: '#/components/schemas/MedianRent'
          - type: 'null'
          description: Latest median advertised rent, in AUD per week.
        median_rent_series:
          anyOf:
          - $ref: '#/components/schemas/MedianRentSeries'
          - type: 'null'
          description: Monthly history of the median weekly rent.
        price_growth_5y:
          anyOf:
          - $ref: '#/components/schemas/PriceGrowth5y'
          - type: 'null'
          description: Total price growth over the past five years, as a decimal fraction (0.42 = +42%) — past performance, not a forecast.
        yield_pct:
          anyOf:
          - $ref: '#/components/schemas/YieldPct'
          - type: 'null'
          description: Gross rental yield as a decimal fraction (0.0346 = 3.46%). The per-microburb `/market/yield-map` gives the same metric as a percent.
        days_on_market:
          anyOf:
          - $ref: '#/components/schemas/DaysOnMarket'
          - type: 'null'
          description: Median days a listing sits before selling — a speed-of-market read, where lower means buyers are moving fast.
        transaction_volume:
          anyOf:
          - $ref: '#/components/schemas/TransactionVolume'
          - type: 'null'
          description: How many properties actually sold recently, with monthly history — the liquidity check behind every other figure here.
      type: object
      title: MarketAll
      description: 'Every market indicator for the suburb in a single call — prices,

        rents, growth, yield, how fast things sell and how much is selling.


        Each field carries exactly the payload its individual endpoint returns,

        so units are as documented on those models — and note in particular

        that `yield_pct` and `price_growth_5y` are **decimal fractions**, not

        percentages. A field that has no data for this suburb comes back null

        rather than failing the whole call.'
    GrowthDrivers:
      properties:
        area_name:
          type: string
          title: Area Name
          description: Suburb (SAL) name.
        area_level:
          type: string
          title: Area Level
          description: Always 'suburb' for this endpoint.
        drivers:
          items:
            $ref: '#/components/schemas/GrowthDriver'
          type: array
          title: Drivers
          description: One row per indicator that carries an attributed impact. Indicators with no value for this suburb, or no matching band, are omitted rather than returned as zero.
      additionalProperties: true
      type: object
      required:
      - area_name
      - area_level
      - drivers
      title: GrowthDrivers
      description: Every capital-growth driver the v6 report attributes to a suburb.
      example:
        area_level: suburb
        area_name: Belmont North
        drivers:
        - band: (0.999, 1.51]
          basis: nat_rel
          category: supply_demand
          direction: positive
          horizon_years: 2
          impact_pct_per_year: 1.11
          indicator: Months of Supply
          key: prop_list_months_of_supply
          source: thresholds_v3_prod
          unit: months
          value: 1.0
        - band: present
          basis: matched_control
          category: risks
          direction: neutral
          horizon_years: 1
          impact_pct_per_year: -0.29
          indicator: Contamination
          key: contamination
          source: dbyd_matched_cg
          unit: '%'
          value: 18.19
        - band: Top
          basis: nat_bin
          category: demographics
          direction: positive
          horizon_years: 4
          impact_pct_per_year: 0.43
          indicator: Cultural Integration
          key: cultural_integration
          source: cultural_integration_sal
          unit: score_0_100
          value: 61.8
