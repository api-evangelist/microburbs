    YieldPct:
      properties:
        area_name:
          type: string
          title: Area Name
          description: Suburb (SAL) name.
        area_level:
          type: string
          title: Area Level
          description: Always 'suburb' for these endpoints.
        house:
          anyOf:
          - type: number
          - type: 'null'
          title: House
          description: Gross rental yield for houses as a decimal fraction (0.0346 = 3.46%) — median weekly house rent × 52 ÷ median house price.
        unit:
          anyOf:
          - type: number
          - type: 'null'
          title: Unit
          description: Gross rental yield for units as a decimal fraction (0.0384 = 3.84%), same calculation as `house`. Usually higher than the house yield, since units cost less relative to the rent they earn.
        as_of:
          anyOf:
          - type: string
          - type: 'null'
          title: As Of
          description: Date of the most recent observation (YYYY-MM-DD).
      additionalProperties: true
      type: object
      required:
      - area_name
      - area_level
      title: YieldPct
      description: 'Gross rental yield for the suburb, houses and units separately.


        ⚠️ **Unit trap:** despite the `_pct` name, the figures here are

        **decimal fractions** — `0.0346` means 3.46%, so multiply by 100 to

        display. The per-microburb version of the same metric

        (`/market/yield-map`) reports it the other way, as a percent (3.46).

        Both are deliberate; just be sure which endpoint you are reading.


        Gross throughout: annual rent over price, before rates, strata,

        management, insurance or vacancy.'
      example:
        area_level: suburb
        area_name: Belmont North
        as_of: '2026-05-24'
        house: 0.0335
        unit: 0.0384
