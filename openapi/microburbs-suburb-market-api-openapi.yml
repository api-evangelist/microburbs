    YieldMb:
      properties:
        mb:
          type: string
          title: Mb
          description: ABS 2021 mesh-block code.
        street:
          anyOf:
          - type: string
          - type: 'null'
          title: Street
          description: Modal street name for the mesh block, title-cased.
        gross_yield_pct:
          type: number
          title: Gross Yield Pct
          description: 'Annual rent as a share of price for this microburb — `weekly_rent × 52 ÷ median_price` — expressed as a percent to 2 dp: `6.65` means 6.65%. The suburb-wide `/market/yield-pct` endpoint reports this same metric as a decimal (0.0665), so the two differ by a factor of 100 by design — check which one you are reading. Gross: before rates, strata, management, insurance or vacancy, so a real net return will be materially lower.'
        weekly_rent:
          type: integer
          title: Weekly Rent
          description: 'The rent side of the yield calculation: modelled median weekly advertised house rent for the microburb, in AUD. Advertised, not contracted, and houses only. Returned so the yield is checkable without a second call.'
        median_price:
          type: integer
          title: Median Price
          description: 'The price side of the yield calculation: modelled median house price for the microburb, in AUD. Houses only, matching `weekly_rent`, so the two divide cleanly.'
      additionalProperties: true
      type: object
      required:
      - mb
      - gross_yield_pct
      - weekly_rent
      - median_price
      title: YieldMb
      description: Gross rental yield for one microburb, with both inputs.
