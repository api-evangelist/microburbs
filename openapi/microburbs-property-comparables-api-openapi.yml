openapi: 3.2.0
info:
  title: Microburbs Property Data Property - Comparables API
  summary: Suburb and property data for every Australian locality.
  description: '**One REST API for demographics, market indicators, risk scores, AVM and

    ranking — backed by 25+ years of Australian transactions and census data.**


    ```bash

    curl ''https://api.microburbs.com.au/v1/properties/GANSW704074813/profile'' \

    -H ''Authorization: Bearer test''

    ```


    ## Why Microburbs


    - **Data depth** — Demographics, lifestyle, risk, market, AVM and growth forecasts — all keyed to the same national suburb and property graph.'
  version: 1.0.0
servers:
- url: https://api.microburbs.com.au
  description: Production
security:
- BearerAuth: []
tags:
- name: Property - Comparables
  description: CMA comp sets and recent nearby sales.
paths:
  /v1/properties/{gnaf_id}/comparables/cma-comp-set:
    get:
      tags:
      - Property - Comparables
      summary: CMA comparable set
      description: 'Top comparable sales used to triangulate the subject property''s value.


        **Price: 60¢ per call.**'
      operationId: get_property_cma_comp_set_v1_properties__gnaf_id__comparables_cma_comp_set_get
      parameters:
      - name: gnaf_id
        in: path
        required: true
        schema:
          type: string
          title: Gnaf Id
          example: GANSW704074813
        example: GANSW704074813
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_list_CmaComp__'
              example:
                data:
                - gnaf_pid: GAACT714923950
                  street: 8 SHIPARD PL
                  bedrooms: 4
                  bathrooms: 2
                  dist_score: 6.319769313849382
                  price: 815000.0
                  date_sold: '2024-07-13'
                  latitude: -35.38013684
                  longitude: 149.06828089
                  sal: Kambah
                  state: ACT
                  property_type: house
                  garage_spaces: 2
                - gnaf_pid: GAACT714962432
                  street: 19 MACKAY CR
                  bedrooms: 4
                  bathrooms: 2
                  dist_score: 6.314913077374466
                  price: 975000.0
                  date_sold: '2024-05-17'
                  latitude: -35.38141033
                  longitude: 149.0765471
                  sal: Kambah
                  state: ACT
                  property_type: house
                  garage_spaces: 2
                - gnaf_pid: GAACT714953151
                  street: 23 BROWNSMITH CR
                  bedrooms: 4
                  bathrooms: 2
                  dist_score: 6.202634043106887
                  price: 1049000.0
                  date_sold: '2024-05-10'
                  latitude: -35.38009598
                  longitude: 149.07224252
                  sal: Kambah
                  state: ACT
                  property_type: house
                  garage_spaces: 4
          headers:
            X-Cost-Cents:
              description: Exact cents billed for this call.
              required: true
              schema:
                type: integer
                minimum: 0
            X-Spent-Cents:
              description: Cumulative cents Autumn reports used for this prepaid wallet.
              required: true
              schema:
                type: integer
                minimum: 0
            X-Remaining-Cents:
              description: Spendable prepaid credit left after this call.
              required: true
              schema:
                type: integer
                minimum: 0
            X-Period-End:
              description: Start of the next UTC calendar month. Prepaid credit does not expire at this timestamp.
              required: true
              schema:
                type: string
                format: date-time
            X-Balance-Cents:
              description: Compatibility alias of X-Remaining-Cents.
              required: true
              schema:
                type: integer
                minimum: 0
            X-Rate-Card-Version:
              description: Version of the endpoint rate card used for this call.
              required: true
              schema:
                type: integer
                minimum: 1
            X-Request-Id:
              description: Request identifier to quote in support requests.
              required: true
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail:
                - type: missing
                  loc:
                  - query
                  - address
                  msg: Field required
                  input: null
