components:
  schemas:
    ParcelFeature:
      properties:
        type:
          type: string
          const: Feature
          title: Type
          description: Always 'Feature'.
        properties:
          additionalProperties: true
          type: object
          title: Properties
          description: 'Feature properties: `gnaf_pid` and `is_subject`.'
        geometry:
          $ref: '#/components/schemas/GeoJsonGeometry'
          description: Parcel polygon, 6 dp coords.
      additionalProperties: true
      type: object
      required:
      - type
      - properties
      - geometry
      title: ParcelFeature
      description: One cadastral parcel as a GeoJSON Feature.
    ParcelFeatureCollection:
      properties:
        type:
          type: string
          const: FeatureCollection
          title: Type
          description: Always 'FeatureCollection'.
        features:
          items:
            $ref: '#/components/schemas/ParcelFeature'
          type: array
          title: Features
          description: One feature per parcel.
      additionalProperties: true
      type: object
      required:
      - type
      - features
      title: ParcelFeatureCollection
      description: RFC 7946 GeoJSON FeatureCollection of parcel polygons.
    ApiResponse_SurroundingPublicHousing_:
      properties:
        data:
          anyOf:
          - $ref: '#/components/schemas/SurroundingPublicHousing'
          - type: 'null'
          description: The endpoint's payload, or `null` when Microburbs has no value.
        available:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Available
          description: '`false` on no-data responses. Omitted on success — branch on `data !== null` if you want a single discriminator.'
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Machine-readable slug naming the no-data condition (e.g. `no_avm_for_GANSW704074813`). Stable per endpoint. Omitted on success.
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
          description: Human-readable explanation. Omitted on success.
      type: object
      title: ApiResponse[SurroundingPublicHousing]
    ApiResponse_SurroundingProperties_:
      properties:
        data:
          anyOf:
          - $ref: '#/components/schemas/SurroundingProperties'
          - type: 'null'
          description: The endpoint's payload, or `null` when Microburbs has no value.
        available:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Available
          description: '`false` on no-data responses. Omitted on success — branch on `data !== null` if you want a single discriminator.'
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Machine-readable slug naming the no-data condition (e.g. `no_avm_for_GANSW704074813`). Stable per endpoint. Omitted on success.
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
          description: Human-readable explanation. Omitted on success.
      type: object
      title: ApiResponse[SurroundingProperties]
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    SurroundingProperty:
      properties:
        gnaf_pid:
          type: string
          title: Gnaf Pid
          description: GNAF PID of this property.
        lat:
          type: number
          title: Lat
          description: Latitude (EPSG:4326).
        lng:
          type: number
          title: Lng
          description: Longitude (EPSG:4326).
        address:
          anyOf:
          - type: string
          - type: 'null'
          title: Address
          description: Street address (title-cased).
        mb:
          anyOf:
          - type: string
          - type: 'null'
          title: Mb
          description: ABS 2021 mesh-block code the property sits in.
        is_subject:
          type: boolean
          title: Is Subject
          description: True for the subject property itself.
      additionalProperties: true
      type: object
      required:
      - gnaf_pid
      - lat
      - lng
      - is_subject
      title: SurroundingProperty
      description: One property inside the search box.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    MbTenure:
      properties:
        mb:
          type: string
          title: Mb
          description: ABS 2021 mesh-block code.
        property_count:
          type: integer
          title: Property Count
          description: Properties inside the search box that sit in this mesh block.
        owned_outright_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Owned Outright Pct
          description: Share of dwellings owned outright (%).
        mortgaged_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Mortgaged Pct
          description: Share of dwellings owned with a mortgage (%).
        rented_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Rented Pct
          description: Share of dwellings rented privately (%).
        public_housing_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Public Housing Pct
          description: Share of dwellings in public/social housing (%).
      additionalProperties: true
      type: object
      required:
      - mb
      - property_count
      title: MbTenure
      description: ABS Census 2021 tenure shares for one mesh block.
    ApiResponse_SurroundingTenure_:
      properties:
        data:
          anyOf:
          - $ref: '#/components/schemas/SurroundingTenure'
          - type: 'null'
          description: The endpoint's payload, or `null` when Microburbs has no value.
        available:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Available
          description: '`false` on no-data responses. Omitted on success — branch on `data !== null` if you want a single discriminator.'
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Machine-readable slug naming the no-data condition (e.g. `no_avm_for_GANSW704074813`). Stable per endpoint. Omitted on success.
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
          description: Human-readable explanation. Omitted on success.
      type: object
      title: ApiResponse[SurroundingTenure]
    ApiResponse_SurroundingListingSignals_:
      properties:
        data:
          anyOf:
          - $ref: '#/components/schemas/SurroundingListingSignals'
          - type: 'null'
          description: The endpoint's payload, or `null` when Microburbs has no value.
        available:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Available
          description: '`false` on no-data responses. Omitted on success — branch on `data !== null` if you want a single discriminator.'
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Machine-readable slug naming the no-data condition (e.g. `no_avm_for_GANSW704074813`). Stable per endpoint. Omitted on success.
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
          description: Human-readable explanation. Omitted on success.
      type: object
      title: ApiResponse[SurroundingListingSignals]
    ListingSignalSummary:
      properties:
        previously_rented:
          type: integer
          title: Previously Rented
          description: Properties with a recent rental.
        previously_for_sale:
          type: integer
          title: Previously For Sale
          description: Properties with a recent sale.
        no_recent_listings:
          type: integer
          title: No Recent Listings
          description: Properties with no listing inside the window.
      additionalProperties: true
      type: object
      required:
      - previously_rented
      - previously_for_sale
      - no_recent_listings
      title: ListingSignalSummary
      description: Counts of each signal across the returned properties.
    ApiResponse_SurroundingParcels_:
      properties:
        data:
          anyOf:
          - $ref: '#/components/schemas/SurroundingParcels'
          - type: 'null'
          description: The endpoint's payload, or `null` when Microburbs has no value.
        available:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Available
          description: '`false` on no-data responses. Omitted on success — branch on `data !== null` if you want a single discriminator.'
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Machine-readable slug naming the no-data condition (e.g. `no_avm_for_GANSW704074813`). Stable per endpoint. Omitted on success.
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
          description: Human-readable explanation. Omitted on success.
      type: object
      title: ApiResponse[SurroundingParcels]
    SurroundingTenure:
      properties:
        gnaf_pid:
          type: string
          title: Gnaf Pid
          description: The subject property's GNAF PID.
        radius_m:
          type: integer
          title: Radius M
          description: Radius of the search box around the subject, metres.
        as_of:
          type: string
          title: As Of
          description: Census anchor date (YYYY-MM-DD).
        mbs:
          items:
            $ref: '#/components/schemas/MbTenure'
          type: array
          title: Mbs
          description: Per-mesh-block tenure shares, sorted by property count desc.
      additionalProperties: true
      type: object
      required:
      - gnaf_pid
      - radius_m
      - as_of
      - mbs
      title: SurroundingTenure
      description: Tenure mix (own / mortgage / rent / public) around the subject.
      example:
        as_of: '2021-08-10'
        gnaf_pid: GANSW704360755
        mbs:
        - mb: '10843090000'
          mortgaged_pct: 39.9
          owned_outright_pct: 35.4
          property_count: 39
          public_housing_pct: 0.0
          rented_pct: 15.2
        - mb: '10842992000'
          mortgaged_pct: 45.9
          owned_outright_pct: 36.3
          property_count: 21
          public_housing_pct: 0.6
          rented_pct: 6.6
        radius_m: 200
