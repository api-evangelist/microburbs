          description: Latitude (EPSG:4326).
        lng:
          type: number
          title: Lng
          description: Longitude (EPSG:4326).
        address:
          anyOf:
          - type: string
          - type: 'null'
          title: Address
          description: Street address (title-cased).
        ph_chance:
          anyOf:
          - type: number
          - type: 'null'
          title: Ph Chance
          description: Classifier confidence band (2 or 3 — every returned row is a positive prediction).
      additionalProperties: true
      type: object
      required:
      - gnaf_pid
      - lat
      - lng
      title: PublicHousingFlag
      description: One property flagged by the public-housing classifier.
    SurroundingListingSignals:
      properties:
        gnaf_pid:
          type: string
          title: Gnaf Pid
          description: The subject property's GNAF PID.
        radius_m:
          type: integer
          title: Radius M
          description: Radius of the search box around the subject, metres.
        recent_window_years:
          type: integer
          title: Recent Window Years
          description: Recency window used to derive the signals (years).
        count:
          type: integer
          title: Count
          description: Properties with any listing history (never-listed properties carry no signal and are omitted).
        signals:
          items:
            $ref: '#/components/schemas/ListingHistorySignal'
          type: array
          title: Signals
          description: Per-property signals, sorted by GNAF PID.
        summary:
          $ref: '#/components/schemas/ListingSignalSummary'
          description: Signal counts across the returned properties.
      additionalProperties: true
      type: object
      required:
      - gnaf_pid
      - radius_m
      - recent_window_years
      - count
      - signals
      - summary
      title: SurroundingListingSignals
      description: Listing-history owner-status signals for properties around the subject.
      example:
        count: 97
        gnaf_pid: GANSW704360755
        radius_m: 200
        recent_window_years: 10
        signals:
        - gnaf_pid: GANSW704349559
          last_sold_date: '2021-11-23'
          last_sold_years_ago: 4.6
          signal: previously_for_sale
        - gnaf_pid: GANSW704341221
          last_sold_date: '2015-01-27'
          last_sold_years_ago: 11.4
          signal: no_recent_listings
        summary:
          no_recent_listings: 24
          previously_for_sale: 55
          previously_rented: 18
    SurroundingPublicHousing:
      properties:
        gnaf_pid:
          type: string
          title: Gnaf Pid
          description: The subject property's GNAF PID.
        radius_m:
          type: integer
          title: Radius M
          description: Radius of the search box around the subject, metres.
        property_count:
          type: integer
          title: Property Count
          description: Total properties inside the search box.
        flagged_count:
          type: integer
          title: Flagged Count
          description: How many of those the classifier flags as public housing.
        flagged:
          items:
            $ref: '#/components/schemas/PublicHousingFlag'
          type: array
          title: Flagged
          description: The flagged properties (empty when none).
      additionalProperties: true
      type: object
      required:
      - gnaf_pid
      - radius_m
      - property_count
      - flagged_count
      - flagged
      title: SurroundingPublicHousing
      description: Public-housing classifier flags for properties around the subject.
      example:
        flagged:
        - address: 3 The Bulwark
          gnaf_pid: GANSW704349559
          lat: -33.80311
          lng: 151.21899
          ph_chance: 3.0
        flagged_count: 1
        gnaf_pid: GANSW704360755
        property_count: 128
        radius_m: 200
    ListingHistorySignal:
      properties:
        gnaf_pid:
          type: string
          title: Gnaf Pid
          description: GNAF PID of the property.
        last_sold_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Sold Date
          description: Most recent Sold/Buy listing date (YYYY-MM-DD).
        last_rent_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Rent Date
          description: Most recent rental listing date (YYYY-MM-DD).
        last_sold_years_ago:
          anyOf:
          - type: number
          - type: 'null'
          title: Last Sold Years Ago
          description: Years since the last sale listing (1 dp).
        last_rent_years_ago:
          anyOf:
          - type: number
          - type: 'null'
          title: Last Rent Years Ago
          description: Years since the last rental listing (1 dp).
        signal:
          type: string
          enum:
          - previously_rented
          - previously_for_sale
          - no_recent_listings
          title: Signal
          description: 'Likely owner status: recent rent listing → `previously_rented` (likely investor); recent sale → `previously_for_sale` (likely mortgaged); neither within the window → `no_recent_listings` (likely owned outright).'
      additionalProperties: true
      type: object
      required:
      - gnaf_pid
      - signal
      title: ListingHistorySignal
      description: Derived owner-status signal for one nearby property.
    SurroundingParcels:
      properties:
        gnaf_pid:
          type: string
          title: Gnaf Pid
          description: The subject property's GNAF PID.
        radius_m:
          type: integer
          title: Radius M
          description: Radius of the search box around the subject, metres.
        count:
          type: integer
          title: Count
          description: Number of parcel features returned.
        parcels:
          $ref: '#/components/schemas/ParcelFeatureCollection'
          description: GeoJSON FeatureCollection, one feature per parcel.
      additionalProperties: true
      type: object
      required:
      - gnaf_pid
      - radius_m
      - count
      - parcels
      title: SurroundingParcels
      description: Cadastral parcel polygons for every property around the subject.
      example:
        count: 127
        gnaf_pid: GANSW704360755
        parcels:
          features:
          - geometry:
              coordinates:
              - - - - 151.221417
                    - -33.800987
                  - - 151.221318
                    - -33.801078
                  - - 151.221308
                    - -33.801256
                  - - 151.221417
                    - -33.800987
              type: MultiPolygon
            properties:
              gnaf_pid: GANSW704355807
              is_subject: false
            type: Feature
          type: FeatureCollection
        radius_m: 200
    GeoJsonGeometry:
      properties:
        type:
          type: string
          title: Type
          description: GeoJSON geometry type, e.g. 'MultiPolygon'.
        coordinates:
          title: Coordinates
          description: Nested coordinate arrays per the GeoJSON spec, lon first.
      additionalProperties: true
      type: object
      required:
      - type
      - coordinates
      title: GeoJsonGeometry
      description: RFC 7946 GeoJSON geometry (Polygon or MultiPolygon in practice).
    SurroundingProperties:
      properties:
        gnaf_pid:
          type: string
          title: Gnaf Pid
          description: The subject property's GNAF PID.
        radius_m:
          type: integer
          title: Radius M
          description: Radius of the search box around the subject, metres.
        count:
          type: integer
          title: Count
          description: Number of properties returned.
        properties:
          items:
            $ref: '#/components/schemas/SurroundingProperty'
          type: array
          title: Properties
          description: Properties inside the box, subject included.
      additionalProperties: true
      type: object
      required:
      - gnaf_pid
      - radius_m
      - count
      - properties
      title: SurroundingProperties
      description: Every GNAF property within 200 m of the subject.
      example:
        count: 128
        gnaf_pid: GANSW704360755
        properties:
        - gnaf_pid: GANSW704355807
          lat: -33.80427291
          lng: 151.21837048
          address: 9 The Barbette
          mb: '10843130000'
          is_subject: false
        - gnaf_pid: GANSW704360755
          lat: -33.80247931
          lng: 151.21971516
          address: 90 The Bulwark
          mb: '10843090000'
          is_subject: true
        radius_m: 200
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: API key as Bearer token. Use `test` for the public sandbox (works only for GNAFs GANSW704074813, GAACT714845944, GAVIC419929404, GAQLD162849753, GAWA_146662014, GASA_422266490, GATAS702292990, GANT_703835649 and SALs 'Belmont North', 'Bondi', 'St Kilda (Vic.)', 'Fortitude Valley', 'Subiaco', 'Unley', 'Sandy Bay', 'Kambah', 'Nightcliff', always 0¢). Mint your own at /developers/keys for full access.
