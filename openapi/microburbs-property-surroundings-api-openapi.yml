openapi: 3.2.0
info:
  title: Microburbs Property Data Property - Surroundings API
  summary: Suburb and property data for every Australian locality.
  description: '**One REST API for demographics, market indicators, risk scores, AVM and

    ranking — backed by 25+ years of Australian transactions and census data.**


    ```bash

    curl ''https://api.microburbs.com.au/v1/properties/GANSW704074813/profile'' \

    -H ''Authorization: Bearer test''

    ```


    ## Why Microburbs


    - **Data depth** — Demographics, lifestyle, risk, market, AVM and growth forecasts — all keyed to the same national suburb and property graph.'
  version: 1.0.0
servers:
- url: https://api.microburbs.com.au
  description: Production
security:
- BearerAuth: []
tags:
- name: Property - Surroundings
  description: The 200m around the property — neighbours, tenure, parcels, housing.
paths:
  /v1/properties/{gnaf_id}/surroundings/properties:
    get:
      tags:
      - Property - Surroundings
      summary: Surrounding properties (200 m)
      description: 'Every GNAF property within 200 m of the subject, with lat/lng and mesh block.


        **Price: 15¢ per call.**'
      operationId: get_property_surrounding_properties_v1_properties__gnaf_id__surroundings_properties_get
      parameters:
      - name: gnaf_id
        in: path
        required: true
        schema:
          type: string
          title: Gnaf Id
          example: GANSW704074813
        example: GANSW704074813
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_SurroundingProperties_'
              example:
                data:
                  count: 128
                  gnaf_pid: GANSW704360755
                  properties:
                  - gnaf_pid: GANSW704355807
                    lat: -33.80427291
                    lng: 151.21837048
                    address: 9 The Barbette
                    mb: '10843130000'
                    is_subject: false
                  - gnaf_pid: GANSW704360755
                    lat: -33.80247931
                    lng: 151.21971516
                    address: 90 The Bulwark
                    mb: '10843090000'
                    is_subject: true
                  radius_m: 200
          headers:
            X-Cost-Cents:
              description: Exact cents billed for this call.
              required: true
              schema:
                type: integer
                minimum: 0
            X-Spent-Cents:
              description: Cumulative cents Autumn reports used for this prepaid wallet.
              required: true
              schema:
                type: integer
                minimum: 0
            X-Remaining-Cents:
              description: Spendable prepaid credit left after this call.
              required: true
              schema:
                type: integer
                minimum: 0
            X-Period-End:
              description: Start of the next UTC calendar month. Prepaid credit does not expire at this timestamp.
              required: true
              schema:
                type: string
                format: date-time
            X-Balance-Cents:
              description: Compatibility alias of X-Remaining-Cents.
              required: true
              schema:
                type: integer
                minimum: 0
            X-Rate-Card-Version:
              description: Version of the endpoint rate card used for this call.
              required: true
              schema:
                type: integer
                minimum: 1
            X-Request-Id:
              description: Request identifier to quote in support requests.
              required: true
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail:
                - type: missing
                  loc:
                  - query
                  - address
                  msg: Field required
                  input: null
      x-price-cents: 15
  /v1/properties/{gnaf_id}/surroundings/tenure:
    get:
      tags:
      - Property - Surroundings
      summary: Surrounding tenure mix (200 m)
      description: 'ABS Census 2021 tenure shares for each mesh block around the subject.


        **Price: 15¢ per call.**'
