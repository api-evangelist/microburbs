        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_SurroundingTenure_'
              example:
                data:
                  as_of: '2021-08-10'
                  gnaf_pid: GANSW704360755
