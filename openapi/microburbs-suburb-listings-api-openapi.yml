components:
  schemas:
    ForSaleListing:
      properties:
        gnaf_pid:
          anyOf:
          - type: string
          - type: 'null'
          title: Gnaf Pid
          description: GNAF persistent identifier of the matched property; null if the listing couldn't be matched to a GNAF address.
        area_level:
          anyOf:
          - type: string
          - type: 'null'
          title: Area Level
          description: Geographic level of this result — always 'address' for a listing row (echoed so the response is self-describing).
        area_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Area Name
          description: Full display address (street, suburb, state).
        address:
          anyOf:
          - $ref: '#/components/schemas/ForSaleAddress'
          - type: 'null'
          description: Parsed address components.
        attributes:
          anyOf:
          - $ref: '#/components/schemas/ForSaleAttributes'
          - type: 'null'
          description: Listed property attributes (as advertised).
        coordinates:
          anyOf:
          - $ref: '#/components/schemas/ForSaleCoordinates'
          - type: 'null'
          description: Geocoded WGS84 lat/long of the property.
        listing_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Listing Date
          description: Date the listing was first observed on market (YYYY-MM-DD).
        price:
          anyOf:
          - type: number
          - type: 'null'
          title: Price
          description: Advertised list price in AUD; null when the ad withholds it (e.g. 'Contact Agent', POA, or price-on-auction).
      additionalProperties: true
      type: object
      title: ForSaleListing
      description: One for-sale listing currently on market in the suburb.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ForSaleAddress:
      properties:
        street:
          anyOf:
          - type: string
          - type: 'null'
          title: Street
          description: Street number and name (e.g. '49A John Street').
        sal:
          anyOf:
          - type: string
          - type: 'null'
          title: Sal
          description: ABS Suburb and Locality (SAL) name the property falls in.
        sa1:
          anyOf:
          - type: string
          - type: 'null'
          title: Sa1
          description: ABS SA1 code — the Statistical Area Level 1 (2021 ASGS, ~200–800 people) the property sits in. Useful for joining ABS census geography.
        state:
          anyOf:
          - type: string
          - type: 'null'
          title: State
          description: State/territory abbreviation (NSW, VIC, QLD, SA, WA, TAS, NT, ACT).
      additionalProperties: true
      type: object
      title: ForSaleAddress
      description: Parsed address fields for a for-sale listing.
    ForSale:
      properties:
        results:
          anyOf:
          - items:
              $ref: '#/components/schemas/ForSaleListing'
            type: array
          - type: 'null'
          title: Results
          description: One entry per active for-sale listing in the suburb (empty list if none). Capped by `limit`.
        total:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total
          description: Total listings on the market in this suburb — the full match count, counted before `limit` is applied, so it stays accurate when the rows are capped.
      additionalProperties: true
      type: object
      title: ForSale
      description: Current for-sale listings snapshot for the suburb.
