openapi: 3.2.0
info:
  title: Microburbs Property Data Suburb - Listings API
  summary: Suburb and property data for every Australian locality.
  description: '**One REST API for demographics, market indicators, risk scores, AVM and

    ranking — backed by 25+ years of Australian transactions and census data.**


    ```bash

    curl ''https://api.microburbs.com.au/v1/properties/GANSW704074813/profile'' \

    -H ''Authorization: Bearer test''

    ```


    ## Why Microburbs


    - **Data depth** — Demographics, lifestyle, risk, market, AVM and growth forecasts — all keyed to the same national suburb and property graph.'
  version: 1.0.0
servers:
- url: https://api.microburbs.com.au
  description: Production
security:
- BearerAuth: []
tags:
- name: Suburb - Listings
  description: Current for-sale listings snapshot.
paths:
  /v1/suburbs/{suburb_name}/listings/for-sale:
    get:
      tags:
      - Suburb - Listings
      summary: Current for-sale listings
      description: 'Current for-sale listings in the suburb, with address, price, beds/baths

        and coordinates per listing.


        `total` is the full number on the market (computed before `limit`), so a

        count is accurate even when the rows are capped. Raise `limit` for more

        listings; set `verbose=true` for the agent''s full description text.


        **Exact suburb identifier required.** Exact ABS Suburb and Locality (SAL) name, e.g. `Burwood (NSW)` — many suburbs carry a state suffix. If starting from free text or an unverified bare name, first call `GET /v1/geocode/suburb?q=`, then use the exact `data[].area_name` it returns. Suburb data endpoints do not guess a state or typo-correct names.


        **Price: 20¢ per call.**'
      operationId: get_suburb_listings_for_sale_v1_suburbs__suburb_name__listings_for_sale_get
      parameters:
      - name: suburb_name
        in: path
        required: true
        schema:
          type: string
          title: Suburb Name
          example: Belmont North
        description: Exact ABS Suburb and Locality (SAL) name, e.g. `Burwood (NSW)` — many suburbs carry a state suffix. If starting from free text or an unverified bare name, first call `GET /v1/geocode/suburb?q=<text>`, then use the exact `data[].area_name` it returns. Suburb data endpoints do not guess a state or typo-correct names.
        example: Belmont North
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          description: Max listings to return (default 30, max 200). `total` always reports the full match count.
          default: 30
          title: Limit
        description: Max listings to return (default 30, max 200). `total` always reports the full match count.
      - name: verbose
        in: query
        required: false
        schema:
          type: boolean
          description: Include the agent's full ad-copy in `attributes.description`. Off by default — it averages ~1.5 KB per listing.
          default: false
          title: Verbose
        description: Include the agent's full ad-copy in `attributes.description`. Off by default — it averages ~1.5 KB per listing.
