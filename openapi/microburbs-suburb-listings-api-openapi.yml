    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ForSaleAttributes:
      properties:
        bedrooms:
          anyOf:
          - type: number
          - type: 'null'
          title: Bedrooms
          description: Advertised bedroom count; null if not stated.
        bathrooms:
          anyOf:
          - type: number
          - type: 'null'
          title: Bathrooms
          description: Advertised bathroom count; null if not stated.
        garage_spaces:
          anyOf:
          - type: number
          - type: 'null'
          title: Garage Spaces
          description: Advertised car/garage space count; null if not stated.
        building_size:
          anyOf:
          - type: string
          - type: 'null'
          title: Building Size
          description: Floor/building area exactly as listed — free-text, units vary (e.g. '345 m²', '190.0'). Frequently unavailable, in which case it comes through as the literal string 'None' or 'nan' rather than a real measurement — treat those as 'not provided'.
        land_size:
          anyOf:
          - type: string
          - type: 'null'
          title: Land Size
          description: Lot size exactly as listed — free-text, units are NOT normalised (e.g. '739 m²', '806.0' sqm, '2.5' acres). Parse per listing; null/'None'/'nan' means not provided.
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Raw marketing copy from the advertisement, verbatim. May include the agent's feature list, rates, and legal disclaimer text. Only returned when the request sets `verbose=true` — it averages ~1.5 KB per listing.
      additionalProperties: true
      type: object
      title: ForSaleAttributes
      description: 'Listed property attributes, as scraped from the advertisement.


        These come straight from the listing, so they''re only as complete and

        tidy as the agent''s ad — counts can be null and the size fields are

        free-text, not normalised numbers.'
    ForSaleCoordinates:
      properties:
        latitude:
          anyOf:
          - type: number
          - type: 'null'
          title: Latitude
          description: Latitude in decimal degrees (WGS84).
        longitude:
          anyOf:
          - type: number
          - type: 'null'
          title: Longitude
          description: Longitude in decimal degrees (WGS84).
      type: object
      title: ForSaleCoordinates
      description: Listing point in WGS84 (EPSG:4326), geocoded from the GNAF address.
    ApiResponse_ForSale_:
      properties:
        data:
          anyOf:
          - $ref: '#/components/schemas/ForSale'
          - type: 'null'
          description: The endpoint's payload, or `null` when Microburbs has no value.
        available:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Available
          description: '`false` on no-data responses. Omitted on success — branch on `data !== null` if you want a single discriminator.'
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Machine-readable slug naming the no-data condition (e.g. `no_avm_for_GANSW704074813`). Stable per endpoint. Omitted on success.
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
          description: Human-readable explanation. Omitted on success.
      type: object
      title: ApiResponse[ForSale]
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: API key as Bearer token. Use `test` for the public sandbox (works only for GNAFs GANSW704074813, GAACT714845944, GAVIC419929404, GAQLD162849753, GAWA_146662014, GASA_422266490, GATAS702292990, GANT_703835649 and SALs 'Belmont North', 'Bondi', 'St Kilda (Vic.)', 'Fortitude Valley', 'Subiaco', 'Unley', 'Sandy Bay', 'Kambah', 'Nightcliff', always 0¢). Mint your own at /developers/keys for full access.
