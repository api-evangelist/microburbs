    TenureMb:
      properties:
        mb:
          type: string
          title: Mb
          description: ABS 2021 mesh-block code identifying this microburb, as a string of digits (keep it a string — leading digits are significant and it overflows a 32-bit int).
        street:
          anyOf:
          - type: string
          - type: 'null'
          title: Street
          description: The most common street name inside the microburb, title-cased — a human handle for an area that otherwise has only a numeric code. Not a boundary or a full address, and several microburbs in a suburb can share one.
        owned_outright_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Owned Outright Pct
          description: Share of dwellings owned outright with no mortgage, as a percent 0–100 (34.7 = 34.7%). Typically tracks an older, longer-settled population.
        mortgaged_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Mortgaged Pct
          description: Share of dwellings owner-occupied but still mortgaged, as a percent 0–100. Add it to `owned_outright_pct` for total owner-occupation.
        renting_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Renting Pct
          description: Share of dwellings rented, as a percent 0–100 — all renting, private landlords and public housing together. This is the figure the suburb-level `tier` is banded on.
        public_housing_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Public Housing Pct
          description: Share of dwellings rented from a state or territory housing authority, as a percent 0–100. A subset of `renting_pct`, not a fourth category — these dwellings are counted in both fields. Stacking all four in one chart double-counts; use owned-outright + mortgaged + renting for a breakdown (which still sums slightly under 100, the remainder being other and not-stated tenures) and show public housing separately.
      additionalProperties: true
      type: object
      required:
      - mb
      title: TenureMb
      description: 'How the households in one microburb hold their homes — owned, being

        paid off, or rented.


        All four shares are **percentages 0–100** (not fractions) of the same

        denominator: occupied private dwellings, including those whose tenure

        was not stated. Two things follow, and both bite people who chart these

        naively — see `public_housing_pct` and the note on summing below.


        These come from a model, not a published count: Census tenure is

        published for larger areas and statistically downscaled to microburb

        level, so read a single microburb as an estimate with real uncertainty.'
