              description: Cumulative cents Autumn reports used for this prepaid wallet.
              required: true
              schema:
                type: integer
                minimum: 0
            X-Remaining-Cents:
              description: Spendable prepaid credit left after this call.
              required: true
              schema:
                type: integer
                minimum: 0
            X-Period-End:
              description: Start of the next UTC calendar month. Prepaid credit does not expire at this timestamp.
              required: true
              schema:
                type: string
                format: date-time
            X-Balance-Cents:
              description: Compatibility alias of X-Remaining-Cents.
              required: true
              schema:
                type: integer
                minimum: 0
            X-Rate-Card-Version:
              description: Version of the endpoint rate card used for this call.
              required: true
              schema:
                type: integer
                minimum: 1
            X-Request-Id:
              description: Request identifier to quote in support requests.
              required: true
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail:
                - type: missing
                  loc:
                  - query
                  - address
                  msg: Field required
                  input: null
      x-price-cents: 10
components:
  schemas:
    UnderclassDrag:
      properties:
        suburb:
          type: string
          title: Suburb
          description: Canonical SAL name.
        welfare_dependency_pct:
          type: number
          title: Welfare Dependency Pct
          description: Share of working-age residents on JobSeeker / Disability Support / carer payments, as a percentage.
        public_housing_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Public Housing Pct
          description: Public-housing share of dwellings, as a percentage.
        public_housing_basis:
          anyOf:
          - type: string
            enum:
            - microburb_downscale
            - census_suburb
          - type: 'null'
          title: Public Housing Basis
          description: Which denominator produced public_housing_pct — 'microburb_downscale' (mesh-block tenure base, preferred) or 'census_suburb' (suburb census population share).
        tier:
          type: string
          enum:
          - High
          - Mid
          - Low
          title: Tier
          description: Underclass concentration tier. High = welfare >= 20% or public housing >= 15%; Low = welfare < 10% and public housing < 2%.
        growth_impact:
          $ref: '#/components/schemas/GrowthImpact'
          description: Capital-growth impact associated with the tier.
        n_microburbs:
          anyOf:
          - type: integer
          - type: 'null'
          title: N Microburbs
          description: Mesh blocks behind the public-housing rollup.
      additionalProperties: true
      type: object
      required:
      - suburb
      - welfare_dependency_pct
      - tier
      - growth_impact
      title: UnderclassDrag
      description: Welfare dependency + public housing, with the underclass tier.
      example:
        growth_impact:
          band: Middle 90%
          pct_per_year: 0.0
        n_microburbs: 77
        public_housing_basis: microburb_downscale
        public_housing_pct: 6.6
        suburb: Belmont North
        tier: Mid
        welfare_dependency_pct: 16.2
    BusinessIndustry:
      properties:
        industry:
          type: string
          title: Industry
          description: Industry key (e.g. trade_construction).
        label:
          type: string
          title: Label
          description: Human industry label.
        share:
          type: number
          title: Share
          description: Share of classified ABNs (0-1).
        n:
          type: integer
          title: N
          description: ABN count in the industry.
      additionalProperties: true
      type: object
      required:
      - industry
      - label
      - share
      - n
      title: BusinessIndustry
      description: One ABN industry share row.
    SuburbAncestryMap:
      properties:
        suburb:
          type: string
          title: Suburb
          description: Canonical SAL name.
        n_microburbs:
          type: integer
          title: N Microburbs
          description: Microburbs with ancestry data.
        microburbs:
          items:
            $ref: '#/components/schemas/AncestryMb'
          type: array
          title: Microburbs
          description: Dominant ancestry per microburb.
        suburb_ancestry_shares:
          items:
            $ref: '#/components/schemas/AncestryShare'
          type: array
          title: Suburb Ancestry Shares
          description: Suburb-level ancestry shares, descending.
      additionalProperties: true
      type: object
      required:
      - suburb
      - n_microburbs
      - microburbs
      - suburb_ancestry_shares
      title: SuburbAncestryMap
      description: Per-microburb dominant ancestry (pilot-coverage dataset).
      example:
        microburbs:
        - dominant_ancestry: Anglo-Australian
          mb: '10694860000'
          persons: 118
          share_pct: 62.1
          street: Edinburgh Rd
        n_microburbs: 37
        suburb: Castlecrag
        suburb_ancestry_shares:
        - ancestry: Anglo-Australian
          pct: 58.4
        - ancestry: Chinese
          pct: 12.9
    PartyResult:
      properties:
        party:
          type: string
          title: Party
          description: Party code (LIB/ALP/GRN/TEAL/…).
        label:
          type: string
          title: Label
          description: Human party name.
        pct:
          type: number
          title: Pct
          description: Projected first-preference share (%).
      additionalProperties: true
      type: object
      required:
      - party
      - label
      - pct
      title: PartyResult
      description: One party's projected first-preference share.
    CohortSa4Rank:
      properties:
        percentile:
          type: integer
          title: Percentile
          description: Share of SA4 cohort strictly below the suburb (0-100).
        position:
          type: string
          enum:
          - top
          - bottom
          title: Position
          description: Which tail the suburb sits in.
        delta_pct:
          type: integer
          title: Delta Pct
          description: Distance from the tail — 6 reads as 'Top 6%'.
        n:
          type: integer
          title: N
          description: SA4 cohort suburbs with a value.
      additionalProperties: true
      type: object
      required:
      - percentile
      - position
      - delta_pct
      - n
      title: CohortSa4Rank
      description: SA4-cohort percentile position for one metric.
    PopulationHistory:
      properties:
        suburb:
          type: string
          title: Suburb
          description: Canonical SAL name.
        lga:
          anyOf:
          - type: string
          - type: 'null'
          title: Lga
          description: The suburb's LGA name.
        current_population:
          anyOf:
          - type: integer
          - type: 'null'
          title: Current Population
          description: Current residents (ABS Census 2021, mesh-block sum).
        microburb_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Microburb Count
          description: Residential microburbs (mesh blocks) in the suburb.
        census_year:
          type: integer
          title: Census Year
          description: Census year of current_population.
        suburb_series:
          items:
            $ref: '#/components/schemas/PopulationPoint'
          type: array
          title: Suburb Series
          description: Suburb census points (2011/2016/2021 where available).
        lga_series:
          items:
            $ref: '#/components/schemas/LgaPopulationPoint'
          type: array
          title: Lga Series
          description: LGA yearly series — ABS ERP history (projected=false) plus a 10-year interpolated projection tail (projected=true).
        suburb_growth:
          anyOf:
          - $ref: '#/components/schemas/PopulationGrowth'
          - type: 'null'
          description: Suburb growth over the census window.
        lga_growth:
          anyOf:
          - $ref: '#/components/schemas/PopulationGrowth'
          - type: 'null'
          description: LGA growth over the last ~10 historical years.
        lga_projection:
          anyOf:
          - $ref: '#/components/schemas/LgaProjection'
          - type: 'null'
          description: LGA projection to the 10-year horizon.
      additionalProperties: true
      type: object
      required:
      - suburb
      - census_year
      - suburb_series
      - lga_series
      title: PopulationHistory
      description: Suburb + LGA population history with a 10-year LGA projection.
      example:
        census_year: 2021
        current_population: 6302
        lga: Lake Macquarie
        lga_growth:
          end_population: 219000
          end_year: 2025
          pct_change: 9.0
          start_population: 201000
          start_year: 2015
        lga_projection:
          pct_change: 12.2
          source: MIB
          to_year: 2035
        lga_series:
        - population: 216983
          projected: false
          year: 2024
        - population: 219000
          projected: false
          year: 2025
        - population: 221672
          projected: true
          year: 2026
        microburb_count: 77
        suburb: Belmont North
        suburb_growth:
          end_population: 6302
          end_year: 2021
          pct_change: 3.5
          start_population: 6086
          start_year: 2011
        suburb_series:
        - population: 6086
          year: 2011
        - population: 6338
          year: 2016
        - population: 6302
          year: 2021
    AncestryShare:
      properties:
        ancestry:
          type: string
          title: Ancestry
          description: Ancestry bucket name.
        pct:
          type: number
          title: Pct
          description: Share of all ancestry responses (%).
      additionalProperties: true
      type: object
      required:
      - ancestry
      - pct
      title: AncestryShare
      description: Suburb-level ancestry share.
    SuburbTenure:
      properties:
        suburb:
          type: string
          title: Suburb
          description: The suburb these figures describe, as the canonical ABS suburb (SAL) name — the resolved form of whatever was requested.
        census_year:
          anyOf:
          - type: integer
          - type: 'null'
          title: Census Year
          description: Reference year of the underlying ABS Census tenure inputs (currently 2021). This is not a current-year occupancy survey.
        owned_outright_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Owned Outright Pct
          description: Suburb-wide share of dwellings owned outright, percent 0–100.
        mortgaged_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Mortgaged Pct
          description: Suburb-wide share owner-occupied with a mortgage, percent 0–100.
        owner_occupied_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Owner Occupied Pct
          description: 'Total suburb owner-occupation rate, percent 0–100: `owned_outright_pct + mortgaged_pct`. Null unless both components are available. This is a modelled, unweighted average across microburbs, not an exact dwelling-weighted ABS SAL count.'
        renting_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Renting Pct
          description: Suburb-wide share of dwellings rented, percent 0–100 — private and public renting combined. Drives `tier`.
        public_housing_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Public Housing Pct
          description: Suburb-wide share rented from a state/territory housing authority, percent 0–100. Included within `renting_pct`, not additional to it.
        tier:
          type: string
          title: Tier
          description: 'One-word read on the suburb''s ownership mix, banded on `renting_pct`: ''Owner-Occupier'' under 7% renters, ''Mixed'' under 20%, ''Investor-Heavy'' at 20% or above (''Unknown'' when there is no renting share). A convenience label — the underlying percentage is the precise figure.'
        n_microburbs:
          type: integer
          title: N Microburbs
          description: 'How many microburbs are listed in `microburbs`. Not the number behind the suburb figures above: very small or sparsely-populated microburbs are filtered out of the list but still counted in the suburb averages, so re-averaging `microburbs` will not exactly reproduce them.'
        microburbs:
          items:
            $ref: '#/components/schemas/TenureMb'
          type: array
          title: Microburbs
          description: Tenure shares for each microburb in the suburb, showing how ownership varies street by street — often the more useful signal, since a single suburb average can hide an owner-occupied pocket next to a rental-heavy one.
      additionalProperties: true
      type: object
      required:
      - suburb
      - tier
      - n_microburbs
      - microburbs
      title: SuburbTenure
      description: 'Who owns and who rents across a suburb — one headline set of shares

        plus the microburb-by-microburb detail underneath.


        The suburb figures are an **unweighted average across the suburb''s

        microburbs**, so each microburb counts equally regardless of how many

        dwellings it holds. That is close to, but not identical with, a true

        dwelling-weighted suburb share; do not expect it to reconcile exactly

        with published Census suburb tenure counts. Same 0–100 percent scale

        and same overlapping-categories caveat as `TenureMb`.'
      example:
        census_year: 2021
        microburbs:
        - mb: '10664530000'
          mortgaged_pct: 41.0
          owned_outright_pct: 38.2
          public_housing_pct: 0.9
          renting_pct: 17.3
          street: Marquis St
        mortgaged_pct: 40.1
        n_microburbs: 71
        owned_outright_pct: 34.7
        owner_occupied_pct: 74.8
        public_housing_pct: 1.8
        renting_pct: 20.9
        suburb: Belmont North
        tier: Mixed
    ApiResponse_SuburbAncestryMap_:
      properties:
        data:
          anyOf:
          - $ref: '#/components/schemas/SuburbAncestryMap'
          - type: 'null'
          description: The endpoint's payload, or `null` when Microburbs has no value.
        available:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Available
          description: '`false` on no-data responses. Omitted on success — branch on `data !== null` if you want a single discriminator.'
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Machine-readable slug naming the no-data condition (e.g. `no_avm_for_GANSW704074813`). Stable per endpoint. Omitted on success.
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
          description: Human-readable explanation. Omitted on success.
      type: object
      title: ApiResponse[SuburbAncestryMap]
    ApiResponse_SuburbCohorts_:
      properties:
        data:
          anyOf:
          - $ref: '#/components/schemas/SuburbCohorts'
          - type: 'null'
