  /v1/suburbs/{suburb_name}/demographics/population-history:
    get:
      tags:
      - Suburb - Demographics
      summary: Total population, history & projection
      description: 'Total suburb population is `current_population` (ABS Census 2021),

        alongside suburb census points (2011/2016/2021) and the LGA''s yearly

        population series with a 10-year modelled projection tail. Use this route

        for questions such as "what is the total population of Clarkson?


        **Exact suburb identifier required.** Exact ABS Suburb and Locality (SAL) name, e.g. `Burwood (NSW)` — many suburbs carry a state suffix. If starting from free text or an unverified bare name, first call `GET /v1/geocode/suburb?q=`, then use the exact `data[].area_name` it returns. Suburb data endpoints do not guess a state or typo-correct names.


        **Price: 10¢ per call.**'
