          type: number
          title: Single Parent Pct
          description: Single-parent-family share as a percentage.
        national_median_pct:
          type: number
          title: National Median Pct
          description: The Australia-wide single-parent-family share to compare `single_parent_pct` against, as a percentage — a fixed 2021 Census benchmark, identical in every response. A different metric and a different number from the unemployment endpoint's benchmark of the same name.
        vs_national:
          type: string
          enum:
          - below
          - above
          title: Vs National
          description: Whether this suburb's single-parent share sits 'below' or 'above' the national benchmark. Exact equality is reported as 'above'.
        growth_impact:
          $ref: '#/components/schemas/GrowthImpact'
          description: The capital-growth difference historically associated with suburbs in this single-parent-share band. An association, not a forecast — see the field's own description.
      additionalProperties: true
      type: object
      required:
      - suburb
      - single_parent_pct
      - national_median_pct
      - vs_national
      - growth_impact
      title: SingleParents
      description: Single-parent-family share vs the national median.
      example:
        growth_impact:
          band: High single-parent share
          pct_per_year: -0.5
        national_median_pct: 5.8
        single_parent_pct: 11.0
        suburb: Belmont North
        vs_national: above
    SuburbVoting:
