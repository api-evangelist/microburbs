          title: Suburb Name
          example: Belmont North
        description: Exact ABS Suburb and Locality (SAL) name, e.g. `Burwood (NSW)` — many suburbs carry a state suffix. If starting from free text or an unverified bare name, first call `GET /v1/geocode/suburb?q=<text>`, then use the exact `data[].area_name` it returns. Suburb data endpoints do not guess a state or typo-correct names.
        example: Belmont North
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_PopulationHistory_'
              example:
                data:
                  census_year: 2021
                  current_population: 6302
                  lga: Lake Macquarie
                  lga_growth:
                    end_population: 219000
                    end_year: 2025
                    pct_change: 9.0
                    start_population: 201000
                    start_year: 2015
                  lga_projection:
                    pct_change: 12.2
                    source: MIB
                    to_year: 2035
                  lga_series:
                  - population: 216983
                    projected: false
                    year: 2024
                  - population: 219000
                    projected: false
                    year: 2025
                  - population: 221672
                    projected: true
                    year: 2026
                  microburb_count: 77
                  suburb: Belmont North
                  suburb_growth:
                    end_population: 6302
                    end_year: 2021
                    pct_change: 3.5
                    start_population: 6086
                    start_year: 2011
                  suburb_series:
                  - population: 6086
                    year: 2011
                  - population: 6338
                    year: 2016
                  - population: 6302
                    year: 2021
