      title: Unemployment
      description: Suburb unemployment rate vs the national median, plus per-mesh-block.
      example:
        basis: labour_force
        growth_impact:
          band: Mid unemployment
          pct_per_year: 0.0
        microburbs:
        - mb: '10664530000'
          street: Marquis St
          unemployment_pct: 3.1
        n_microburbs: 71
        national_median_pct: 5.2
        suburb: Belmont North
        unemployment_pct: 4.2
        vs_national: below
    GrowthImpact:
      properties:
        pct_per_year:
          type: number
          title: Pct Per Year
          description: The growth difference historically associated with this band, in percentage points per year on a percent scale — `-3.8` means 3.8 percentage points a year worse, `0.5` means half a point a year better, and `0.0` (the common case, for suburbs in the middle band) means no association either way. A relative difference, not a growth rate in its own right.
        band:
          type: string
          title: Band
          description: Plain-language name of the band the suburb landed in, suitable for display alongside the figure — e.g. 'Middle 90%', 'High unemployment', 'Low private-school share'. The wording differs per indicator; treat it as a label, not a shared enum.
      additionalProperties: true
      type: object
      required:
      - pct_per_year
      - band
      title: GrowthImpact
      description: 'What a suburb''s score on this indicator has historically gone

        together with, in capital-growth terms.


        ⚠️ **This is an association, not a prediction, and not a calculation

        from this suburb''s own numbers.** The suburb is sorted into one of a

        few bands, and each band carries a fixed figure drawn from Microburbs''

        research across many suburbs. Two suburbs in the same band always

        return exactly the same `pct_per_year`. Do not add these up across

        indicators to build a growth forecast, and do not present the figure

        as something this suburb will do.'
    IncomePocket:
      properties:
        street:
          type: string
          title: Street
          description: Modal street of the pocket's MB.
        weekly_income:
          type: integer
          title: Weekly Income
          description: Median household income ($/week).
      additionalProperties: true
      type: object
      required:
      - street
      - weekly_income
      title: IncomePocket
      description: Highest/lowest income pocket callout.
    ApiResponse_SingleParents_:
      properties:
        data:
          anyOf:
          - $ref: '#/components/schemas/SingleParents'
          - type: 'null'
          description: The endpoint's payload, or `null` when Microburbs has no value.
        available:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Available
          description: '`false` on no-data responses. Omitted on success — branch on `data !== null` if you want a single discriminator.'
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Machine-readable slug naming the no-data condition (e.g. `no_avm_for_GANSW704074813`). Stable per endpoint. Omitted on success.
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
          description: Human-readable explanation. Omitted on success.
      type: object
      title: ApiResponse[SingleParents]
    LgaPopulationPoint:
      properties:
        year:
          type: integer
          title: Year
          description: Calendar year.
        population:
          type: integer
          title: Population
          description: Estimated resident population.
        projected:
          type: boolean
          title: Projected
          description: True on the 10-year modelled projection tail.
      additionalProperties: true
      type: object
      required:
      - year
      - population
      - projected
      title: LgaPopulationPoint
      description: One LGA population reading — ABS ERP history or projection tail.
    PopulationPoint:
      properties:
        year:
          type: integer
          title: Year
          description: Census year (2011/2016/2021).
        population:
          type: integer
          title: Population
          description: Residents counted that year.
      additionalProperties: true
      type: object
      required:
      - year
      - population
      title: PopulationPoint
      description: One suburb census reading (ABS Census years).
    ApiResponse_SuburbTenure_:
      properties:
        data:
          anyOf:
          - $ref: '#/components/schemas/SuburbTenure'
          - type: 'null'
          description: The endpoint's payload, or `null` when Microburbs has no value.
        available:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Available
          description: '`false` on no-data responses. Omitted on success — branch on `data !== null` if you want a single discriminator.'
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Machine-readable slug naming the no-data condition (e.g. `no_avm_for_GANSW704074813`). Stable per endpoint. Omitted on success.
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
          description: Human-readable explanation. Omitted on success.
      type: object
      title: ApiResponse[SuburbTenure]
    PrivateSchoolMicroburb:
      properties:
        mb:
          type: string
          title: Mb
          description: ABS mesh-block code.
        street:
          anyOf:
          - type: string
          - type: 'null'
          title: Street
          description: Modal street name in the mesh block.
        private_school_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Private School Pct
          description: Downscaled private-school share for the mesh block.
      additionalProperties: true
