        in: query
        required: false
        schema:
          type: integer
          description: Row offset — page through results more than 25 deep. `meta.next_offset` gives the value for the next page.
          default: 0
          title: Offset
        description: Row offset — page through results more than 25 deep. `meta.next_offset` gives the value for the next page.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_FinderSearchResponse_'
              example:
                data:
                  meta:
                    limit: 25
                    offset: 0
                    returned: 25
                    total: 126
                  suburbs:
                  - lga: Lake Macquarie
                    rank: 3
                    sa4: Newcastle and Lake Macquarie
                    state: NSW
