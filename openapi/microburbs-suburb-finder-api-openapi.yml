components:
  schemas:
    FieldsResponse:
      properties:
        fields:
          items:
            $ref: '#/components/schemas/FinderField'
          type: array
          title: Fields
          description: Every filterable / returnable field.
      type: object
      required:
      - fields
      title: FieldsResponse
      description: The finder field catalog.
      example:
        fields:
        - key: grossYield
          label: Gross rental yield
          unit: percent
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    FinderField:
      properties:
        key:
          type: string
          title: Key
          description: camelCase field key — pass this in `filter` / `sort`.
        label:
          type: string
          title: Label
          description: Human-readable label.
        unit:
          type: string
          title: Unit
          description: Unit of the value — currency | percent | count | days | km | score | index.
      type: object
      required:
      - key
      - label
      - unit
      title: FinderField
      description: One filterable / sortable metric in the finder catalog.
      example:
        key: grossYield
        label: Gross rental yield
        unit: percent
    RegionsResponse:
      properties:
        regions:
          additionalProperties:
            items:
              type: string
            type: array
          type: object
          title: Regions
          description: '`{state: [sa4, ...]}` — pass a state to `states` and/or an SA4 to `regions`.'
      type: object
      required:
      - regions
      title: RegionsResponse
      description: Scope options — SA4 regions grouped by state abbreviation.
      example:
        regions:
          NSW:
          - Sydney - City and Inner South
          - Newcastle and Lake Macquarie
    FinderRow:
      properties:
        rank:
          type: integer
          title: Rank
          description: Position in the ranked result, 1 = top of the sort (out of `meta.total`).
        suburb:
          type: string
          title: Suburb
          description: Suburb (SAL) name.
        state:
          anyOf:
          - type: string
          - type: 'null'
          title: State
          description: State abbreviation (NSW, VIC, ...).
        sa4:
          anyOf:
          - type: string
          - type: 'null'
          title: Sa4
          description: SA4 region name.
        lga:
          anyOf:
          - type: string
          - type: 'null'
          title: Lga
          description: Local Government Area name.
        value:
          anyOf:
          - type: number
          - type: 'null'
          title: Value
          description: Value of the sort field (as ranked). Present only for the first 5 and last 5 rows of the page, and only for a median or growth sort. Absent = not shown — call the per-field endpoint for this suburb.
      type: object
      required:
      - rank
      - suburb
      title: FinderRow
      description: 'One matched suburb — rank + identity, plus the value for the first/last few.


        `rank` (the row''s position in the ranked result, 1 = top of the sort, out of

        `meta.total`) is present on every row. `value` (the sort field''s actual number)

        is present only for the first 5 and last 5 rows of the page, and only when the

        sort field is a median or a growth. For any other suburb''s number, call the

        per-field endpoint (market/*, forecast/*).'
      example:
