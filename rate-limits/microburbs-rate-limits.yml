note: >-
  The API advertises "predictable rate limits" and documents 429 as a coded
  response, but does not publish numeric per-window limits. The dominant runtime
  control is a prepaid spend wallet, not a request-count quota: every metered
  response carries cost/spend/balance headers and calls stop when credit reaches
  zero. Exact rate-limit response headers (X-RateLimit-*/RateLimit-*/Retry-After)
  are not documented, so limit_count is recorded honestly as 0.
