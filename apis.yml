name: Microburbs
description: 'Microburbs is an Australian property and location-intelligence API: 173 read-only operations spanning
  property valuations (AVM), sale and rent history, comparable sales, environmental and neighbourhood risk overlays,
  zoning and development, schools, transport, demographics and suburb screening -- keyed to ABS statistical geography
  and G-NAF addresses, and mirrored as a hosted MCP server of 174 tools with per-call cent metering.'
