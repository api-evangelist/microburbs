note: >-
  Microburbs prices the API per endpoint, not per subscription tier. There are no
  named monthly plans for API access -- it is a metered, prepaid pay-per-call
  model. Every response returns X-Cost-Cents matching the exact cents billed;
  bulk/"all" endpoints ship at a flat bundle price. Prepaid credit is tracked in a
  wallet (X-Remaining-Cents) and calls stop at zero. The public marketing
  /pricing and /api-access pages are JS-rendered and expose no server-side plan
  text; the authoritative pricing is the per-call rate card in the contract
  itself. Per-endpoint cents below are read verbatim from live tool descriptions.
